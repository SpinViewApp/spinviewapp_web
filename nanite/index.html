<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wake Virtual Mesh</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0d11; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; outline: none; }
  #status { position: fixed; left: 12px; bottom: 10px; color: #9aa4b4;
            font: 12px/1.4 monospace; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
<div id="status">loading wasm...</div>
<script>
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (t) { if (statusEl) statusEl.textContent = t || ''; },
    onRuntimeInitialized: function () { if (statusEl) statusEl.textContent = ''; }
  };
  if (!navigator.gpu)
    statusEl.textContent = 'WebGPU unavailable in this browser (App is the WebGPU build).';
</script>
<script src="App.js"></script>
</body>
</html>
