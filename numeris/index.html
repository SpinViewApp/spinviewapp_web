<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Numeris</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="numeris_favicon_512.jpg">
<link rel="apple-touch-icon" href="numeris_favicon_512.jpg">
<script src="version.js"></script>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
body {
  position: fixed;
  inset: 0;
  touch-action: none;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  font-family: Arial, Helvetica, sans-serif;
}
.game-canvas {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  outline: 0;
  background: #000;
  z-index: 0;
}
.app-loader {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: rgba(255, 255, 255, 0.35);
  background: #000;
  z-index: 50;
}
.app-spinner {
  width: 40px;
  height: 40px;
  margin-bottom: 12px;
  border: 4px solid rgba(255, 255, 255, 0.08);
  border-top-color: rgba(255, 255, 255, 0.42);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.debug-console {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: 48px;
  display: none;
  max-height: 50vh;
  overflow: auto;
  box-sizing: border-box;
  padding: 10px;
  color: #a8efa8;
  background: rgba(0, 0, 0, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 8px;
  font: 12px/1.4 Consolas, Monaco, monospace;
  white-space: pre-wrap;
  word-break: break-word;
  user-select: text;
  -webkit-user-select: text;
  z-index: 100;
}
.debug-console.visible { display: block; }
.debug-console.has-error {
  color: #ff9b9b;
  border-color: rgba(255, 90, 90, 0.75);
}
.debug-button {
  position: fixed;
  right: 8px;
  bottom: 8px;
  display: none;
  min-width: 44px;
  height: 28px;
  padding: 0 8px;
  color: #fff;
  background: rgba(22, 22, 22, 0.84);
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 5px;
  font: 700 11px Arial, Helvetica, sans-serif;
  z-index: 110;
}
.debug-button.visible { display: block; }
.debug-button.has-error {
  background: rgba(120, 0, 0, 0.84);
  border-color: rgba(255, 100, 100, 0.85);
}
</style>
</head>
<body>
<div class="app-loader" id="loader">
  <div class="app-spinner"></div>
  <div id="loaderText">Loading engine...</div>
</div>
<div class="debug-console" id="debugConsole"></div>
<button class="debug-button" id="debugButton" type="button">...</button>
<canvas class="game-canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
<script>
/* Source of truth for web shell — copied by build.cwc to {pOut}index.html
 * (same pattern as blobcone_fast). Loads App.js only AFTER Module is ready,
 * with cache-bust query args so wasm/js don't stick on mobile. */
(function () {
  "use strict";

  var canvas = document.getElementById("canvas");
  var loader = document.getElementById("loader");
  var loaderText = document.getElementById("loaderText");
  var debugConsole = document.getElementById("debugConsole");
  var debugButton = document.getElementById("debugButton");
  var logNative = console.log ? console.log.bind(console) : function () {};
  var infoNative = console.info ? console.info.bind(console) : logNative;
  var warnNative = console.warn ? console.warn.bind(console) : logNative;
  var errNative = console.error ? console.error.bind(console) : logNative;
  var consoleOpen = false;
  var lineCount = 0;
  var host = location.hostname || "";
  var debugOn =
    /(?:^|[?&])debug(?:[=&]|$)/i.test(String(location.search || "")) ||
    host === "localhost" ||
    host === "127.0.0.1" ||
    host === "::1" ||
    host.indexOf("192.168.") === 0 ||
    window.spinviewDebugEnabled === true;

  function getCurrentVersion() {
    if (typeof window.getCurrentVersion === "function")
      return window.getCurrentVersion();
    try {
      return new URL(location.href).searchParams.get("_v") ||
        localStorage.getItem("siteVersion") ||
        "dev";
    } catch (e) {
      return "dev";
    }
  }

  function bootToken() {
    if (!window.__spinBootTok) window.__spinBootTok = Date.now();
    return window.__spinBootTok;
  }

  function cacheBust(path) {
    var version = getCurrentVersion();
    var sep = path.indexOf("?") >= 0 ? "&" : "?";
    return path + sep + "_v=" + encodeURIComponent(version) + "&_t=" + bootToken();
  }

  function updateVersionLabel() {
    var version = getCurrentVersion();
    document.title = "Numeris " + version;
    if (debugButton) debugButton.textContent = version;
    if (loaderText) loaderText.textContent = "Loading engine... " + version;
  }

  function consoleShow() {
    consoleOpen = true;
    debugConsole.classList.add("visible");
  }
  function consoleHide() {
    consoleOpen = false;
    debugConsole.classList.remove("visible");
  }
  function consoleToggle() {
    if (consoleOpen) consoleHide();
    else consoleShow();
  }

  function stringifyArg(v) {
    if (v === undefined) return "undefined";
    if (v === null) return "null";
    if (typeof v === "string") return v;
    if (v instanceof Error) return v.stack || v.message || String(v);
    if (typeof v === "object") {
      try { return JSON.stringify(v); }
      catch (e) { return String(v); }
    }
    return String(v);
  }

  function mirrorConsole(kind, args) {
    var parts = [], i, el;
    for (i = 0; i < args.length; ++i) parts.push(stringifyArg(args[i]));
    el = document.createElement("div");
    el.textContent = parts.join(" ");
    debugConsole.appendChild(el);
    lineCount++;
    while (lineCount > 400 && debugConsole.firstChild) {
      debugConsole.removeChild(debugConsole.firstChild);
      lineCount--;
    }
    debugConsole.scrollTop = debugConsole.scrollHeight;
    if (kind === "error") {
      debugConsole.classList.add("has-error");
      debugButton.classList.add("visible", "has-error");
      if (debugOn) consoleShow();
    }
  }

  function resizeCanvas() {
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
  }

  window.spinviewUpdateVersionLabel = updateVersionLabel;

  console.log = function () {
    var a = Array.prototype.slice.call(arguments);
    mirrorConsole("log", a);
    logNative.apply(null, a);
  };
  console.info = function () {
    var a = Array.prototype.slice.call(arguments);
    mirrorConsole("info", a);
    infoNative.apply(null, a);
  };
  console.warn = function () {
    var a = Array.prototype.slice.call(arguments);
    mirrorConsole("warn", a);
    warnNative.apply(null, a);
  };
  console.error = function () {
    var a = Array.prototype.slice.call(arguments);
    mirrorConsole("error", a);
    errNative.apply(null, a);
  };

  debugButton.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    e.stopPropagation();
    if (window.spinviewDeactivateKeyboard) window.spinviewDeactivateKeyboard();
    if (document.activeElement === canvas) canvas.blur();
    consoleToggle();
  });
  document.addEventListener("pointerdown", function (e) {
    if (!consoleOpen) return;
    if (debugConsole.contains(e.target) || e.target === debugButton) return;
    consoleHide();
  });

  window.addEventListener("error", function (e) {
    console.error("[error]", e.message || "Unknown JavaScript error",
      e.filename || "", e.lineno || 0, e.colno || 0,
      e.error ? (e.error.stack || e.error) : "");
  });
  window.addEventListener("unhandledrejection", function (e) {
    console.error("[unhandledrejection]", e.reason);
  });
  canvas.addEventListener("webglcontextlost", function (e) {
    e.preventDefault();
    console.error("[webgl] Context lost.");
  }, false);
  canvas.addEventListener("webglcontextrestored", function () {
    console.warn("[webgl] Context restored.");
  }, false);

  window.addEventListener("load", resizeCanvas);
  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("orientationchange", function () {
    setTimeout(resizeCanvas, 50);
    setTimeout(resizeCanvas, 250);
    setTimeout(resizeCanvas, 500);
  });

  var loaderHidden = false;
  function hideLoader() {
    if (loaderHidden) return;
    loaderHidden = true;
    if (loader) loader.style.display = "none";
  }
  window.numerisHideLoader = hideLoader;
  /* If C never signals first ink (old wasm, abort-before-draw), don't stick. */
  setTimeout(function () { hideLoader(); }, 8000);

  updateVersionLabel();

  (function probeWebGL2() {
    var probe = document.createElement("canvas");
    var gl = null;
    probe.width = 16;
    probe.height = 16;
    try {
      gl = probe.getContext("webgl2", {
        alpha: false,
        antialias: false,
        depth: true,
        stencil: true,
        preserveDrawingBuffer: false,
        powerPreference: "high-performance",
        failIfMajorPerformanceCaveat: false
      });
    } catch (e) {
      console.error("[webgl] WebGL2 probe failed.", e);
    }
    if (!gl) {
      console.error("[webgl] WebGL2 is required.");
      return;
    }
    if (debugOn) {
      console.info("[webgl]",
        "MAX_FRAGMENT_UNIFORM_VECTORS=", gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS),
        "MAX_VERTEX_UNIFORM_VECTORS=", gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS),
        "MAX_TEXTURE_SIZE=", gl.getParameter(gl.MAX_TEXTURE_SIZE));
    }
  })();

  /* Module MUST exist before App.js — same contract as blobcone_fast / spinviewapp_web/test. */
  window.Module = {
    canvas: canvas,
    webglContextAttributes: {
      alpha: false,
      antialias: false,
      depth: true,
      stencil: true,
      preserveDrawingBuffer: false,
      powerPreference: "high-performance",
      failIfMajorPerformanceCaveat: false
    },
    preRun: [],
    postRun: [],
    locateFile: function (path) {
      return cacheBust(path);
    },
    print: function () {
      console.log("[stdout]", Array.prototype.slice.call(arguments).join(" "));
    },
    printErr: function () {
      console.error("[stderr]", Array.prototype.slice.call(arguments).join(" "));
    },
    setStatus: function (msg) {
      if (debugOn && msg) console.info("[status]", msg);
    },
    monitorRunDependencies: function () {},
    onAbort: function (reason) {
      console.error("[abort]", reason);
      if (loaderText) loaderText.textContent = "Engine aborted.";
    },
    onRuntimeInitialized: function () {
      resizeCanvas();
      if (window.spinviewActivateKeyboard) window.spinviewActivateKeyboard();
      if (typeof window.Shell_OnLoad === "function") window.Shell_OnLoad();
      /* Stay over the canvas until a dark WebGL frame is committed
       * (numerisHideLoader). Then the blit lifts and the title writes. */
      if (loaderText) loaderText.textContent = "Preparing... " + getCurrentVersion();
      console.info("[runtime] Ready.");
    }
  };

  debugButton.classList.add("visible");
  window.spinviewConsoleShow = consoleShow;
  window.spinviewConsoleHide = consoleHide;
  window.spinviewConsoleToggle = consoleToggle;

  var s = document.createElement("script");
  s.src = cacheBust("App.js");
  s.async = true;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
