<style>
/* ============================================================
   SpinView - cinema shell
   One full-screen stage. Content comes from _data/catalog.json.
   ============================================================ */

:root {
  --bg:            #000000;
  --ink:           #ffffff;
  --ink-soft:      rgba(255,255,255,.72);
  --ink-faint:     rgba(255,255,255,.42);
  --line:          rgba(255,255,255,.16);
  --line-soft:     rgba(255,255,255,.09);

  --cyan:          #4dd6ff;
  --violet:        #9a6bff;
  --magenta:       #ff5ce1;
  --accent:        var(--cyan);

  --stage-pad-x:   clamp(22px, 6vw, 96px);
  --stage-pad-t:   96px;
  --stage-pad-b:   96px;
  /* the copy block is a fixed height, centred in the stage - so its lower
     edge sits at the same place on every slide, and the button pinned just
     under that edge never moves either */
  /* a floor as well as a proportion: on a short laptop 42vh is not enough
     to hold the feature grid, and the block would grow past the button */
  --copy-h:        max(420px, 42vh);
  --cta-gap:       34px;

  --ease:          cubic-bezier(.22,.61,.36,1);
  --ease-out:      cubic-bezier(.16,1,.3,1);

  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* Pure full-screen by default. The archive below is only reachable
   when there is released content to scroll to (body.has-more). */
html, body { height: 100%; overflow: hidden; }
html.has-more, html.has-more body {
  height: auto;
  overflow-x: hidden;
  overflow-y: auto;
  scroll-behavior: smooth;
}

img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

::selection { background: rgba(77,214,255,.28); }

:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
  border-radius: 4px;
}

/* ------------------------------------------------------------------ intro */

#intro {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  background: #000;
  transition: opacity .85s var(--ease), visibility .85s;
}
#intro.done { opacity: 0; visibility: hidden; pointer-events: none; }

.intro-lockup {
  display: grid;
  justify-items: center;
  gap: clamp(16px, 2.6vh, 26px);
  opacity: 0;
  /* opacity only - a scale or width animation on a logo reads as a wobble */
  animation: introIn .7s var(--ease) .05s forwards;
}
.intro-word {
  font-size: clamp(11px, 1.5vw, 14px);
  font-weight: 500;
  letter-spacing: .62em;
  text-indent: .62em;
  color: rgba(255,255,255,.82);
}
.intro-rule {
  width: clamp(120px, 18vw, 230px);
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
  opacity: 0;
  animation: introIn .8s var(--ease) .28s forwards;
}
@keyframes introIn { to { opacity: 1; } }

/* ------------------------------------------------------------------ chrome */

.mark-corner {
  position: fixed;
  top: max(18px, env(safe-area-inset-top));
  left: max(18px, env(safe-area-inset-left));
  z-index: 60;
  display: flex;
  align-items: center;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity .7s var(--ease) .15s, transform .7s var(--ease) .15s;
}
body.lit .mark-corner { opacity: .5; transform: none; }
.mark-corner:hover, .mark-corner:focus-visible { opacity: 1 !important; }
.mark-corner span {
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .34em;
  text-indent: .34em;
  color: rgba(255,255,255,.9);
  text-shadow: 0 0 4px rgba(0,0,0,.9), 0 0 14px rgba(0,0,0,.7);
}

/* Project switcher. Doubles as the "whose slide is this" indicator, so the
   name never has to be repeated a third time in the chrome. */
.projects {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  right: max(18px, env(safe-area-inset-right));
  z-index: 60;
  display: flex;
  align-items: center;
  gap: clamp(14px, 2vw, 24px);
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity .7s var(--ease) .2s, transform .7s var(--ease) .2s;
}
body.lit .projects { opacity: 1; transform: none; }

.proj {
  position: relative;
  padding: 5px 0 7px;
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .24em;
  text-indent: .24em;
  text-transform: uppercase;
  white-space: nowrap;
  color: rgba(255,255,255,.32);
  text-shadow: 0 0 3px rgba(0,0,0,.95), 0 0 10px rgba(0,0,0,.85), 0 0 24px rgba(0,0,0,.6);
  transition: color .3s var(--ease);
}
.proj:hover { color: rgba(255,255,255,.78); }
.proj.on { color: #fff; }
.proj::after {
  content: "";
  position: absolute;
  left: 0;
  right: .24em;
  bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--cyan), var(--magenta));
  box-shadow: 0 0 10px rgba(120,190,255,.55);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform .45s var(--ease);
}
.proj.on::after { transform: scaleX(1); }
.proj .tag {
  display: inline-block;
  margin-left: 7px;
  padding: 1px 4px;
  border: 1px solid rgba(255,196,107,.4);
  border-radius: 2px;
  font-size: 8px;
  letter-spacing: .1em;
  text-indent: .1em;
  color: #ffc46b;
  vertical-align: 1px;
}

/* ------------------------------------------------------------------- stage */

.stage {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
}

.bg-layer { position: absolute; inset: 0; z-index: 0; }

.bg-shot {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1.15s var(--ease);
  will-change: opacity;
}
.bg-shot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 45%;
  transform: scale(1.08);
}
.bg-shot.on { opacity: 1; }
.bg-shot.on img { animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift {
  from { transform: scale(1.06) translate3d(-.8%, .6%, 0); }
  to   { transform: scale(1.15) translate3d(.9%, -.9%, 0); }
}

/* dim the photo when the slide has its own visual (segmentation) */
.bg-shot.muted { filter: blur(26px) saturate(.55) brightness(.42); }

.scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  transition: opacity .9s var(--ease);
  background:
    radial-gradient(118% 80% at 50% 46%, rgba(0,0,0,.22) 0%, rgba(0,0,0,.66) 60%, rgba(0,0,0,.92) 100%),
    linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.18) 26%, rgba(0,0,0,.42) 62%, rgba(0,0,0,.94) 100%);
}
.grain {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: .16;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.5'/></svg>");
}

/* ------------------------------------------------------------------ slides */

.slides {
  position: relative;
  z-index: 3;
  height: 100%;
  display: grid;
}
.slide {
  grid-area: 1 / 1;
  display: grid;
  align-content: center;
  justify-items: center;
  padding: var(--stage-pad-t) var(--stage-pad-x) var(--stage-pad-b);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .5s var(--ease), visibility .5s;
}
.slide.on { opacity: 1; visibility: visible; pointer-events: auto; }

.slide-inner {
  position: relative;
  width: 100%;
  max-width: 820px;
  min-height: var(--copy-h);
  display: grid;
  align-content: center;
  justify-items: center;
  text-align: center;
  gap: clamp(14px, 2vh, 22px);
}

/* Legibility comes from the glyphs themselves: a black glow radiating from
   the letterforms, layered from tight to wide. It follows the shape of the
   text instead of dropping a dark panel over the picture, so the backdrop
   stays fully visible. --halo scales it per slide (0 removes it). */

/* No idle animation on the copy. A slow translation of large light type
   either steps in whole pixels or, once promoted to its own layer, goes
   soft - both were worse than a still frame. The life on screen comes from
   the backdrop, which drifts continuously behind the scrim. */

/* per-element entrance */
.slide .anim {
  opacity: 0;
  transform: translateY(16px);
}
.slide.on .anim {
  animation: riseIn .9s var(--ease-out) forwards;
}
.slide.on .anim:nth-child(1) { animation-delay: .06s; }
.slide.on .anim:nth-child(2) { animation-delay: .14s; }
.slide.on .anim:nth-child(3) { animation-delay: .22s; }
.slide.on .anim:nth-child(4) { animation-delay: .30s; }
.slide.on .anim:nth-child(5) { animation-delay: .38s; }
@keyframes riseIn { to { opacity: 1; transform: none; } }

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: clamp(10px, 1.15vw, 11.5px);
  font-weight: 600;
  letter-spacing: .3em;
  text-indent: .3em;
  text-transform: uppercase;
  color: var(--cyan);
  text-shadow:
    0 0 1px  rgba(0,0,0, calc(1 * var(--halo, 1))),
    0 0 4px  rgba(0,0,0, calc(.98 * var(--halo, 1))),
    0 0 9px  rgba(0,0,0, calc(.92 * var(--halo, 1))),
    0 0 20px rgba(0,0,0, calc(.80 * var(--halo, 1))),
    0 0 40px rgba(0,0,0, calc(.62 * var(--halo, 1))),
    0 0 76px rgba(0,0,0, calc(.45 * var(--halo, 1)));
}
.kicker::before {
  content: "";
  width: 22px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan));
  text-indent: 0;
}

.badge {
  display: inline-block;
  padding: 3px 8px 2px;
  border: 1px solid rgba(255,196,107,.42);
  border-radius: 3px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .2em;
  text-indent: .2em;
  text-transform: uppercase;
  color: #ffc46b;
  background: rgba(8,6,3,.55);
  box-shadow: 0 0 22px -6px rgba(255,196,107,.45), 0 2px 12px rgba(0,0,0,.6);
}

.card-badge {
  position: absolute;
  top: 11px; right: 12px;
  padding: 3px 7px 2px;
  border: 1px solid rgba(255,196,107,.42);
  border-radius: 3px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #ffc46b;
  background: rgba(10,8,4,.6);
}

.title {
  margin: 0;
  font-size: clamp(44px, 8.6vw, 118px);
  line-height: .96;
  font-weight: 200;
  letter-spacing: -.028em;
  text-wrap: balance;
  text-shadow:
    0 0 2px   rgba(0,0,0, calc(.92 * var(--halo, 1))),
    0 0 6px   rgba(0,0,0, calc(.86 * var(--halo, 1))),
    0 0 14px  rgba(0,0,0, calc(.78 * var(--halo, 1))),
    0 0 30px  rgba(0,0,0, calc(.68 * var(--halo, 1))),
    0 0 62px  rgba(0,0,0, calc(.54 * var(--halo, 1))),
    0 0 120px rgba(0,0,0, calc(.40 * var(--halo, 1))),
    0 2px 6px rgba(0,0,0, calc(.62 * var(--halo, 1)));
}
.title em {
  font-style: normal;
  background: linear-gradient(96deg, var(--cyan), var(--violet) 52%, var(--magenta));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.blurb {
  margin: 0;
  max-width: 58ch;
  font-size: clamp(14.5px, 1.55vw, 18.5px);
  line-height: 1.62;
  font-weight: 300;
  color: var(--ink-soft);
  text-wrap: pretty;
  text-shadow:
    0 0 2px   rgba(0,0,0, calc(.96 * var(--halo, 1))),
    0 0 5px   rgba(0,0,0, calc(.90 * var(--halo, 1))),
    0 0 12px  rgba(0,0,0, calc(.82 * var(--halo, 1))),
    0 0 26px  rgba(0,0,0, calc(.66 * var(--halo, 1))),
    0 0 54px  rgba(0,0,0, calc(.48 * var(--halo, 1))),
    0 1px 3px rgba(0,0,0, calc(.80 * var(--halo, 1)));
}

/* ---------------------------------------------------------------- actions */

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: clamp(6px, 1.4vh, 14px);
}
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 48px;
  padding: 0 26px;
  border: 1px solid var(--line);
  border-radius: 3px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .17em;
  text-indent: .17em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(3,7,13,.5);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  text-shadow: 0 0 10px rgba(0,0,0,.7);
  overflow: hidden;
  transition: border-color .3s var(--ease), background .3s var(--ease),
              transform .3s var(--ease), box-shadow .3s var(--ease);
}
.btn:hover { border-color: rgba(255,255,255,.4); background: rgba(16,26,40,.62); transform: translateY(-1px); }

.btn.primary {
  /* one accent, nothing else: dark glass, a cyan edge, white type */
  border-color: rgba(77,214,255,.62);
  color: #ffffff;
  background: rgba(3,9,15,.62);
  box-shadow:
    0 0 18px -6px rgba(77,214,255,.45),
    inset 0 0 20px rgba(77,214,255,.07);
}
.btn.primary::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(77,214,255,.1);
  opacity: 0;
  transition: opacity .35s var(--ease);
}
.btn.primary:hover {
  border-color: var(--cyan);
  transform: translateY(-2px);
  box-shadow:
    0 0 28px -6px rgba(77,214,255,.75),
    inset 0 0 26px rgba(77,214,255,.12);
}
.btn.primary:hover::after { opacity: 1; }

/* ------------------------------------------------------------ seg / clusters */

.slide.kind-segmentation .slide-inner {
  max-width: 1180px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.02fr);
  align-items: center;
  gap: clamp(28px, 4.5vw, 66px);
  text-align: left;
  justify-items: stretch;
}
.seg-copy { display: grid; gap: clamp(12px, 1.8vh, 20px); justify-items: start; }
.seg-copy .title { font-size: clamp(34px, 4.6vw, 62px); }
.seg-copy .blurb { max-width: 44ch; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 7px 13px;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .07em;
  color: rgba(255,255,255,.62);
  background: rgba(6,8,13,.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  text-shadow: 0 1px 3px rgba(0,0,0,.7);
}
.chip::before {
  content: "";
  display: inline-block;
  width: 5px; height: 5px;
  margin-right: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 9px var(--cyan);
  vertical-align: middle;
}

/* the cluster viewer */
.seg-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 735 / 654;
  max-height: calc(var(--copy-h) - 8px);
  margin: 0 auto;
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  overflow: hidden;
  background: #05070d;
  box-shadow: 0 40px 90px -40px rgba(0,0,0,.95);
}
/* soften the model's studio backdrop into the dark page */
.seg-stage::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background:
    radial-gradient(78% 66% at 50% 44%, transparent 44%, rgba(3,5,10,.62) 82%, rgba(3,5,10,.94) 100%);
}
.seg-plate, .seg-grid { filter: saturate(1.05) contrast(1.06); }
.seg-plate {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: 50% 50%;
  opacity: 0;
  transition: opacity .8s var(--ease);
}
.seg-stage.solid .seg-plate { opacity: 1; }

.seg-grid {
  position: absolute;
  inset: 0;
  display: grid;
  gap: 0px;
  transition: gap 1.4s var(--ease-out);
}
.seg-stage.building .seg-grid { gap: 3px; }
.seg-cell {
  background-repeat: no-repeat;
  opacity: 0;
  transform: scale(.7);
  filter: brightness(1.9) saturate(1.4);
}
.seg-stage.play .seg-cell {
  animation: cellIn .82s var(--ease-out) forwards;
}
@keyframes cellIn {
  0%   { opacity: 0; transform: scale(.55); filter: brightness(2.6) saturate(1.6); }
  45%  { opacity: 1; transform: scale(1.03); filter: brightness(1.7) saturate(1.4); }
  100% { opacity: 1; transform: scale(1);    filter: none; }
}

.seg-scan {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(180deg,
    transparent 0%,
    rgba(77,214,255,.06) 42%,
    rgba(160,220,255,.5) 50%,
    rgba(77,214,255,.06) 58%,
    transparent 100%);
  mix-blend-mode: screen;
}
.seg-stage.play .seg-scan { animation: scan 2.6s var(--ease) 2 forwards; }
@keyframes scan {
  0%   { opacity: 0; transform: translateY(-100%); }
  12%  { opacity: 1; }
  88%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(100%); }
}

.seg-frame {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(77,214,255,.18), inset 0 0 60px rgba(0,0,0,.6);
}
.seg-corner {
  position: absolute;
  width: 16px; height: 16px;
  border: 1px solid rgba(77,214,255,.55);
}
.seg-corner.tl { top: 9px;  left: 9px;  border-right: 0; border-bottom: 0; }
.seg-corner.tr { top: 9px;  right: 9px; border-left: 0;  border-bottom: 0; }
.seg-corner.bl { bottom: 9px; left: 9px; border-right: 0; border-top: 0; }
.seg-corner.br { bottom: 9px; right: 9px; border-left: 0; border-top: 0; }

.seg-hud {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,.62);

}

/* ---------------------------------------------------------------- features */

.slide.kind-features .title { font-size: clamp(36px, 5.4vw, 74px); }
.slide.kind-features .slide-inner { max-width: 960px; }

.feature-grid {
  display: grid;

.feature {

  transition: background .3s var(--ease);
}
.feature:hover { background: rgba(18,24,38,.8); }
.feature b {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -.005em;
  color: #fff;
}
.feature span {
  display: block;
  font-size: 12.5px;
  line-height: 1.5;
  font-weight: 300;
  color: var(--ink-faint);
}

/* The call to action does not live inside the slide copy: it is pinned to
   the stage, so it holds exactly the same spot for every slide of a project
   and never blinks out on a slide that declares no action of its own. */
.cta {
  position: absolute;
  z-index: 15;
  left: 0;
  right: 0;

}

.cta-inner { position: relative; display: inline-flex; }

.cta .btn.ghost {

  top: 0;

}

.nav {

}

.arrow {

  display: grid;
  place-items: center;
  border-radius: 50%;

}
.arrow:hover { color: #fff; background: rgba(255,255,255,.08); }
.arrow svg { width: 13px; height: 13px; }

.dots { display: flex; align-items: center; }
.dot-group { display: flex; align-items: center; gap: 9px; }

  position: absolute;
  left: -11px;
  top: 50%;
  width: 1px;
  height: 9px;
  transform: translateY(-50%);
  background: rgba(255,255,255,.16);
}
.dot-btn {
  position: relative;
  width: 26px;
  height: 22px;
  display: grid;
  place-items: center;
}
.dot-btn i {

.dot-btn i::after {

}
.dot-btn.on i::after { width: var(--p, 0%); }
.dot-btn.seen i::after { width: 100%; background: rgba(255,255,255,.5); box-shadow: none; }

.counter {

      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function ver() {
    return window.SPINVIEW_VERSION ? ("?v=" + window.SPINVIEW_VERSION) : "";
  }

  /* Resolve a presentation asset against the project's generated _base. */
  function asset(item, raw) {
    if (!raw) return "";
    if (/^(https?:)?\/\//i.test(raw) || raw.charAt(0) === "/") return raw;
    var base = item && item._base ? item._base : "";
    return base + raw;
  }

  /* Deep links.
       /?polynite            -> that project, first slide
       /?polynite=clusters   -> that project, that slide id
       /?p=polynite          -> same as the first form
       /#polynite/clusters   -> same, via the hash
     A project reachable this way does not have to be featured or released,
     so an unreleased project can still be previewed through a direct link. */
  function readDeepLink() {
    var out = { project: "", slide: "" };
    var raw = "";
    var q = (location.search || "").replace(/^\?/, "");

    if (q) {
      var parts = q.split("&");
      for (var i = 0; i < parts.length; i++) {
        if (!parts[i]) continue;
        var kv = parts[i].split("=");
        var k = "", v = "";
        try { k = decodeURIComponent(kv[0] || ""); } catch (e) { k = kv[0] || ""; }
        try { v = decodeURIComponent(kv[1] || ""); } catch (e) { v = kv[1] || ""; }
        if (!k) continue;
        if (k === "p" || k === "project" || k === "app") { raw = v; break; }
        raw = k;
        if (kv.length > 1) out.slide = v;
        break;
      }
    }
    if (!raw) {
      try { raw = decodeURIComponent((location.hash || "").replace(/^#/, "")); }
      catch (e) { raw = (location.hash || "").replace(/^#/, ""); }
    }

    var seg = String(raw).split("/");
    out.project = (seg[0] || "").toLowerCase().trim();
    if (seg[1] && !out.slide) out.slide = seg[1];
    out.slide = String(out.slide || "").toLowerCase().trim();
    return out;
  }

  /* Index of the first slide matching a deep link, or -1. */
  function findDeep(deep) {
    if (!deep || !deep.project) return -1;
    var first = -1;
    for (var i = 0; i < state.slides.length; i++) {
      var s = state.slides[i];
      var pid = String((s._p && s._p.id) || "").toLowerCase();
      if (pid !== deep.project) continue;
      if (first < 0) first = i;
      if (!deep.slide) return i;
      if (String(s.id || "").toLowerCase() === deep.slide) return i;
    }
    return first;
  }

  var reduced = false;
  try {
    reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (e) {}

  /* --------------------------------------------------------------- model */

  /* A project is shown on the front stage when it is visible, featured and
     released. `released` defaults to (status === "live") so older project
     files keep working without an edit. */
  function isReleased(p) {
    if (typeof p.released === "boolean") return p.released;
    return p.status === "live";
  }

  function pickProjects(cat) {
    var all = (cat && cat.projects) || [];
    return all.filter(function (p) { return p.visible !== false; });
  }

  function shuffled(a) {
    var out = a.slice(), i, j, t;
    for (i = out.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  /* A slide may draw its backdrop from a pool instead of naming one file:
       "pool": "showcase"   -> the named list in the project's "pools"
       "pool": "screens"    -> the project's own screens array
       "pool": ["a", "b"]   -> an inline list
     Paths resolve against _base like any other presentation asset. */
  function resolvePool(p, raw) {
    var list = null;
    if (raw === true || raw === "screens") list = p.screens || [];
    else if (typeof raw === "string") list = (p.pools && p.pools[raw]) || [];
    else if (Object.prototype.toString.call(raw) === "[object Array]") list = raw;
    if (!list || !list.length) return null;
    var out = [];
    for (var i = 0; i < list.length; i++) out.push(asset(p, list[i]));
    return out;
  }

  /* Deal one backdrop per pooled slide: never the same shot twice on the
     same pass, and never the shot that slide just had. skip keeps the
     slide currently on screen untouched. */
  function dealImages(skip) {
    var used = {};
    var i, k, bag, pick;

    for (i = 0; i < state.slides.length; i++) {
      if (!state.slides[i].pool) used[state.slides[i].image] = true;
    }
    if (skip != null && state.slides[skip]) used[state.slides[skip].image] = true;

    for (i = 0; i < state.slides.length; i++) {
      var sl = state.slides[i];
      if (!sl.pool || i === skip) continue;

      bag = shuffled(sl.pool);
      pick = null;
      for (k = 0; k < bag.length; k++) {
        if (!used[bag[k]] && bag[k] !== sl.image) { pick = bag[k]; break; }
      }
      if (!pick) {
        for (k = 0; k < bag.length; k++) if (!used[bag[k]]) { pick = bag[k]; break; }
      }
      if (!pick) pick = bag[0];

      used[pick] = true;
      sl.image = pick;
      if (sl._img && sl._img.getAttribute("src") !== pick + ver()) {
        sl._img.src = pick + ver();
      }
    }
  }

  /* "App · Live" when a project declares no kicker of its own. */
  function kickerFor(p) {
    var a = p.collection || p.type || "";
    var b = p.status || "";
    var t = function (x) { return x ? x.charAt(0).toUpperCase() + x.slice(1) : ""; };
    return [t(a), t(b)].filter(Boolean).join(" \u00b7 ");
  }

  /* Every slide has to say whose slide it is. When the headline already
     carries the project name (a title card), the kicker stays as written;
     otherwise the project name is prefixed onto it. */
  function ownedKicker(p, kicker, title) {
    var name = String(p.title || "");
    if (!name) return kicker;
    var low = name.toLowerCase();
    if (String(title || "").toLowerCase().indexOf(low) >= 0) return kicker;
    if (String(kicker || "").toLowerCase().indexOf(low) >= 0) return kicker;
    return kicker ? (name + " \u00b7 " + kicker) : name;
  }

  /* Turn a project into an array of stage slides. A project may declare its
     own `slides`; otherwise one slide is derived from its base fields. */
  function slidesFor(p) {
    var out = [];
    var list = p.slides && p.slides.length ? p.slides : null;

    if (!list) {
      out.push({
        _p: p,
        kind: "hero",
        image: asset(p, p.cover || (p.screens && p.screens[0])),
        pool: resolvePool(p, p.pool),
        focus: "50% 45%",
        lift: p.lift || 0,
        halo: (p.halo != null ? p.halo : 1),
        scrim: (p.scrim != null ? p.scrim : 1),
        kicker: p.featured_kicker || kickerFor(p),
        badge: p.badge || "",
        title: p.title,
        text: p.description || p.short || "",
        actions: p.play ? [{ label: p.play_label || ("Open " + p.title), href: p.play, primary: true }] : []
      });
      return out;
    }

    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      out.push({
        _p: p,
        id: s.id || (p.id + "-" + i),
        kind: s.kind || "hero",
        image: asset(p, s.image),
        pool: resolvePool(p, s.pool),
        focus: s.focus || "50% 45%",
        lift: s.lift || p.lift || 0,
        halo: (s.halo != null ? s.halo : (p.halo != null ? p.halo : 1)),
        scrim: (s.scrim != null ? s.scrim : (p.scrim != null ? p.scrim : 1)),
        kicker: ownedKicker(p, s.kicker || p.featured_kicker || "", s.title || p.title),
        badge: s.badge !== undefined ? s.badge : (p.badge || ""),
        title: s.title || p.title,
        text: s.text || "",
        chips: s.chips || [],
        stats: s.stats || [],
        readout: s.readout || "",
        actions: s.actions || []
      });
    }
    return out;
  }

  /* ------------------------------------------------------------ rendering */

  var state = {
    slides: [],
    index: 0,
    timer: null,
    tick: null,
    started: 0,
    paused: false,
    cueSeen: false
  };

  function words(t) {
    t = String(t || "").trim();
    return t ? t.split(/\s+/).length : 0;
  }

  /* How long a slide holds. A slide is on screen for as long as it takes to
     read it, not for a fixed beat: the opening card is a hook and gets out of
     the way fast, a dense card lingers. A slide may override this with
     "duration" (milliseconds) in project.json. */
  function durationFor(s, isFirst) {
    if (s.duration) return s.duration;

    var n = words(s.title) + words(s.text);
    if (s.chips) n += words(s.chips.join(" "));

    var d = 2600 + n * 190;

    if (s.kind === "segmentation") {
      d += 3400;                       /* the clusters take ~2.6s to assemble */
    } else if (s.kind === "features") {
      var f = (s._p && s._p.features) ? s._p.features.length : 0;
      d += 1200 + f * 300;
    }

    if (isFirst) d = Math.min(d * 0.72, 5400);

    return Math.max(4000, Math.min(d, 10500));
  }

  function buildBackgrounds() {
    var layer = $("bgLayer");
    layer.innerHTML = "";
    state.slides.forEach(function (s, i) {
      var wrap = el("div", "bg-shot");
      if (s.kind === "segmentation") wrap.className += " muted";
      if (s.image) {
        var img = el("img");
        img.src = s.image + ver();
        img.alt = "";
        img.decoding = "async";
        img.loading = i === 0 ? "eager" : "lazy";
        img.style.objectPosition = s.focus;
        /* a dark screenshot needs a lift before the scrim buries it */
        if (s.lift) img.style.filter = "brightness(" + s.lift + ") saturate(1.12)";
        /* A shot that 404s is dropped from its pool and replaced, so one
           file missing from a deploy cannot leave a slide on black. */
        img.onerror = function () {
          var dead = s.image;
          if (s.pool && s.pool.length > 1) {
            s.pool = s.pool.filter(function (u) { return u !== dead; });
            try { console.warn("[SpinView] missing " + dead + " - dropped from pool"); } catch (e) {}
            dealImages(null);
          } else {
            try { console.warn("[SpinView] missing " + dead); } catch (e) {}
            this.remove();
          }
        };
        wrap.appendChild(img);
        s._img = img;
      }
      layer.appendChild(wrap);
      s._bg = wrap;
    });
  }

  /* Primary action: whatever the slide declares, else the project's own
     launch link. It is therefore identical across a project's slides, which
     is the whole point - the button must not move or vanish. */
  function ctaFor(s) {
    var p = s._p || {};
    var acts = s.actions || [];
    var primary = null, extras = [];

    /* the project's own launch link wins, so the label and the width are
       identical on every one of its slides */
    if (p.play) {
      primary = { label: p.play_label || ("Open " + (p.title || "")), href: p.play, primary: true };
    }
    for (var i = 0; i < acts.length; i++) {
      if (primary && acts[i].href === primary.href) continue;
      if (!primary && acts[i].primary) { primary = acts[i]; continue; }
      extras.push(acts[i]);
    }
    return { primary: primary, extras: extras };
  }

  function renderCta(s) {
    var host = $("cta");
    if (!host) return;
    var cfg = ctaFor(s);
    host.innerHTML = "";
    if (!cfg.primary && !cfg.extras.length) return;

    var wrap = el("div", "cta-inner");

    function mk(a, cls) {
      var node;
      if (a.href) { node = el("a", cls); node.href = a.href; }
      else {
        node = el("button", cls);
        node.type = "button";
        node.addEventListener("click", function () {
          var t = indexOfSlideId(a.slide);
          if (t >= 0) go(t, true);
        });
      }
      node.textContent = a.label || "Open";
      return node;
    }

    if (cfg.primary) wrap.appendChild(mk(cfg.primary, "btn primary"));
    cfg.extras.forEach(function (a) { wrap.appendChild(mk(a, "btn ghost")); });
    host.appendChild(wrap);
  }

  function indexOfSlideId(id) {
    if (!id) return -1;
    for (var i = 0; i < state.slides.length; i++) {
      if (state.slides[i].id === id) return i;
    }
    return -1;
  }

  /* Kicker line, optionally carrying a status badge ("Beta", "Preview"...). */
  function kickerNode(s, extraClass) {
    if (!s.kicker && !s.badge) return null;
    var k = el("div", "kicker" + (extraClass || ""));
    if (s.kicker) {
      var t = el("span");
      t.textContent = s.kicker;
      k.appendChild(t);
    }
    if (s.badge) {
      var b = el("span", "badge");
      b.textContent = s.badge;
      k.appendChild(b);
    }
    return k;
  }

  function heroSlide(s) {
    var inner = el("div", "slide-inner");
    var k = kickerNode(s, " anim"); if (k) inner.appendChild(k);
    var h = el("h1", "title anim");
    h.innerHTML = markTitle(s.title);
    inner.appendChild(h);
    if (s.text) { var p = el("p", "blurb anim"); p.textContent = s.text; inner.appendChild(p); }
    return inner;
  }

  function revealSlide(s) {
    var inner = el("div", "slide-inner");
    var k = kickerNode(s, " anim"); if (k) inner.appendChild(k);
    var h = el("h1", "title anim");
    h.innerHTML = markTitle(s.title);
    inner.appendChild(h);
    if (s.text) { var p = el("p", "blurb anim"); p.textContent = s.text; inner.appendChild(p); }
    return inner;
  }

  function featureSlide(s) {
    var inner = el("div", "slide-inner");
    var k = kickerNode(s, " anim"); if (k) inner.appendChild(k);
    var h = el("h1", "title anim");
    h.innerHTML = markTitle(s.title);
    inner.appendChild(h);
    if (s.text) { var p = el("p", "blurb anim"); p.textContent = s.text; inner.appendChild(p); }

    var feats = (s._p && s._p.features) || [];
    if (feats.length) {
      var grid = el("div", "feature-grid anim");
      feats.forEach(function (f) {
        var cell = el("div", "feature");
        var b = el("b"); b.textContent = f.title || "";
        var sp = el("span"); sp.textContent = f.text || "";
        cell.appendChild(b); cell.appendChild(sp);
        grid.appendChild(cell);
      });
      inner.appendChild(grid);
    }
    return inner;
  }

  /* The cluster viewer: the segmentation shot is assembled cell by cell,
     the gaps close, and the readout completes. */
  /* 182 tiles each painting a scaled copy of the same JPEG is heavy on a
     phone GPU, so the grid is coarser on small screens. */
  var SEG_COLS = 14, SEG_ROWS = 13;
  try {
    if (window.innerWidth <= 620) { SEG_COLS = 9; SEG_ROWS = 8; }
    else if (window.innerWidth <= 900) { SEG_COLS = 11; SEG_ROWS = 10; }
  } catch (e) {}

  function segSlide(s) {
    var inner = el("div", "slide-inner");

    var copy = el("div", "seg-copy anim");
    var segK = kickerNode(s, ""); if (segK) copy.appendChild(segK);
    var h = el("h2", "title"); h.innerHTML = markTitle(s.title); copy.appendChild(h);
    if (s.text) { var p = el("p", "blurb"); p.textContent = s.text; copy.appendChild(p); }
    if (s.chips && s.chips.length) {
      var chips = el("div", "chips");
      s.chips.forEach(function (c) {
        var chip = el("span", "chip"); chip.textContent = c; chips.appendChild(chip);
      });
      copy.appendChild(chips);
    }
    if (s.stats && s.stats.length) {
      var st = el("div", "chips");
      s.stats.forEach(function (x) {
        var chip = el("span", "chip");
        chip.textContent = (x.value ? x.value + " " : "") + (x.label || "");
        st.appendChild(chip);
      });
      copy.appendChild(st);
    }
    inner.appendChild(copy);

    var stage = el("div", "seg-stage anim");
    var grid = el("div", "seg-grid");
    grid.style.gridTemplateColumns = "repeat(" + SEG_COLS + ", 1fr)";
    grid.style.gridTemplateRows = "repeat(" + SEG_ROWS + ", 1fr)";

    var cx = (SEG_COLS - 1) / 2, cy = (SEG_ROWS - 1) / 2;
    var maxD = Math.sqrt(cx * cx + cy * cy);

    for (var y = 0; y < SEG_ROWS; y++) {
      for (var x = 0; x < SEG_COLS; x++) {
        var cell = el("div", "seg-cell");
        cell.style.backgroundImage = "url('" + s.image + ver() + "')";
        cell.style.backgroundSize = (SEG_COLS * 100) + "% " + (SEG_ROWS * 100) + "%";
        cell.style.backgroundPosition =
          (SEG_COLS > 1 ? (x / (SEG_COLS - 1)) * 100 : 0) + "% " +
          (SEG_ROWS > 1 ? (y / (SEG_ROWS - 1)) * 100 : 0) + "%";
        var d = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)) / maxD;
        /* centre-out wave with a touch of scatter so it never looks like a wipe */
        var jitter = ((x * 7 + y * 13) % 5) * 0.028;
        cell.style.animationDelay = (0.12 + d * 1.05 + jitter).toFixed(3) + "s";
        grid.appendChild(cell);
      }
    }
    var plate = el("div", "seg-plate");
    plate.style.backgroundImage = "url('" + s.image + ver() + "')";
    stage.appendChild(plate);
    stage.appendChild(grid);

    var scan = el("div", "seg-scan"); stage.appendChild(scan);

    var frame = el("div", "seg-frame");
    ["tl", "tr", "bl", "br"].forEach(function (c) {
      frame.appendChild(el("div", "seg-corner " + c));
    });
    stage.appendChild(frame);

    var hud = el("div", "seg-hud");
    var dot = el("span", "dot"); hud.appendChild(dot);
    var label = el("span"); label.textContent = s.readout || "Building cluster hierarchy";
    hud.appendChild(label);
    hud.appendChild(el("span", "grow"));
    var pct = el("span", "pct"); pct.textContent = "0%";
    hud.appendChild(pct);
    var bar = el("div", "seg-bar");
    hud.appendChild(bar);
    stage.appendChild(hud);

    inner.appendChild(stage);

    /* The cell animations are on a clock; the image is not. If the assembly
       starts before the file has decoded, every delay has already elapsed by
       the time pixels exist and the whole thing pops in at once - which is
       exactly what a slow phone shows. So we wait for the decode. */
    var probe = new Image();
    var ready = false;
    var waiting = null;
    probe.onload = probe.onerror = function () {
      ready = true;
      if (waiting) { var f = waiting; waiting = null; f(); }
    };
    probe.src = s.image + ver();
    if (probe.complete) ready = true;

    s._seg = {
      stage: stage, pct: pct, bar: bar, raf: null,
      isReady: function () { return ready; },
      onReady: function (fn) { if (ready) fn(); else waiting = fn; }
    };
    return inner;
  }

  function markTitle(t) {
    /* wrap *word* in a gradient span */
    return esc(t).replace(/\*(.+?)\*/g, "<em>$1</em>");
  }

  function segPlay(s) {
    var seg = s._seg;
    if (!seg) return;
    if (seg.onReady && !seg.isReady()) {
      seg.onReady(function () {
        if (state.slides[state.index] === s) segPlay(s);
      });
      return;
    }
    var stage = seg.stage;
    stage.classList.remove("play", "building", "solid");
    /* force reflow so the animation restarts */
    void stage.offsetWidth;
    stage.classList.add("play", "building");

    var total = reduced ? 200 : 2600;
    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();

    if (seg.raf) cancelAnimationFrame(seg.raf);
    function step(now) {
      var t = Math.min(1, ((now || Date.now()) - t0) / total);
      var v = Math.round(t * 100);
      seg.pct.textContent = v + "%";
      seg.bar.style.width = v + "%";
      if (t < 1) {
        seg.raf = requestAnimationFrame(step);
      } else {
        seg.pct.textContent = "READY";
        stage.classList.remove("building");
        stage.classList.add("solid");
      }
    }
    seg.raf = requestAnimationFrame(step);
  }

  function segStop(s) {
    var seg = s._seg;
    if (!seg) return;
    if (seg.raf) cancelAnimationFrame(seg.raf);
    seg.stage.classList.remove("play", "building", "solid");
    seg.pct.textContent = "0%";
    seg.bar.style.width = "0%";
  }

  function buildSlides() {
    var host = $("slides");
    host.innerHTML = "";
    state.slides.forEach(function (s, i) {
      var node = el("section", "slide kind-" + s.kind);
      if (s.halo !== 1) node.style.setProperty("--halo", String(s.halo));
      node.setAttribute("role", "tabpanel");
      node.setAttribute("aria-label", (i + 1) + " of " + state.slides.length);
      var inner;
      if (s.kind === "segmentation")   inner = segSlide(s);
      else if (s.kind === "features")  inner = featureSlide(s);
      else if (s.kind === "reveal")    inner = revealSlide(s);
      else                             inner = heroSlide(s);
      node.appendChild(inner);
      host.appendChild(node);
      s._node = node;
    });
  }

  /* One run of dots per project, so the reel reads as "five of these,
     then one of those" rather than one undifferentiated row. */
  function buildDots() {
    var host = $("dots");
    host.innerHTML = "";
    var group = null, lastId = null;

    state.slides.forEach(function (s, i) {
      var pid = (s._p && s._p.id) || "";
      if (pid !== lastId) {
        group = el("div", "dot-group");
        host.appendChild(group);
        lastId = pid;
      }
      var b = el("button", "dot-btn");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-label", ((s._p && s._p.title) || "Slide") + " " + (s._n || (i + 1)));
      b.title = (s._p && s._p.title) || "";
      b.appendChild(el("i"));
      b.addEventListener("click", function () { go(i, true); });
      group.appendChild(b);
      s._dot = b;
    });
  }

  /* ------------------------------------------------------------- carousel */

  function go(i, manual) {
    if (!state.slides.length) return;
    var n = state.slides.length;
    var next = ((i % n) + n) % n;
    var prev = state.index;

    state.slides.forEach(function (s, k) {
      var on = k === next;
      /* --p still holds ~100% from this dot's last run; clear it before the
         dot goes active or it flashes full for one frame */
      s._dot.style.setProperty("--p", "0%");
      s._node.classList.toggle("on", on);
      s._bg.classList.toggle("on", on);
      s._dot.classList.toggle("on", on);
      s._dot.classList.toggle("seen", !on && k < next);
      s._dot.setAttribute("aria-selected", on ? "true" : "false");
      if (!on && s.kind === "segmentation" && k === prev) segStop(s);
    });

    state.index = next;

    $("counter").textContent =
      pad(state.slides[next]._n) + " / " + pad(state.slides[next]._of);

    syncProjectNav(state.slides[next]._p);

    /* a new pass gets a new set of backdrops, dealt behind the viewer */
    if (n > 1 && next === 0 && prev === n - 1) {
      setTimeout(function () { dealImages(0); }, 1600);
    }

    var sc = $("scrim");
    if (sc) sc.style.opacity = String(state.slides[next].scrim != null ? state.slides[next].scrim : 1);

    var cur = state.slides[next];
    if (cur.kind === "segmentation") segPlay(cur);
    renderCta(cur);
    if (manual) syncUrl(cur);
    updateCue(next, n);

    restart(manual);
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function updateCue(index, total) {
    var cue = $("cue");
    if (!cue) return;
    var show = !state.cueSeen && total > 0 && index === total - 1;
    cue.classList.toggle("show", show);
  }

  /* Reflect the project the viewer is on, so the address bar can be copied.
     Only on deliberate navigation - autoplay never rewrites the URL. */
  var urlLock = false;
  function syncUrl(slide) {
    if (urlLock) return;
    if (!window.history || !history.replaceState) return;
    var id = (slide._p && slide._p.id) || "";
    if (!id) return;
    try {
      history.replaceState(null, "", location.pathname + "?" + encodeURIComponent(id));
    } catch (e) {}
  }

  function restart(manual) {
    stopTimer();
    if (state.slides.length < 2) return;
    state.started = Date.now();
    var s = state.slides[state.index];
    var d = durationFor(s, state.index === 0);

    state.tick = setInterval(function () {
      if (state.paused) { state.started += 60; return; }
      var p = Math.min(100, ((Date.now() - state.started) / d) * 100);
      s._dot.style.setProperty("--p", p + "%");
      if (p >= 100) { stopTimer(); go(state.index + 1); }
    }, 60);
    if (manual) { /* no-op, kept for clarity */ }
  }

  function stopTimer() {
    if (state.tick) { clearInterval(state.tick); state.tick = null; }
  }

  /* ------------------------------------------------------- project switcher */

  function buildProjectNav() {
    var host = $("projectNav");
    if (!host) return;
    host.innerHTML = "";

    var seen = {}, order = [];
    state.slides.forEach(function (s, i) {
      var p = s._p;
      if (!p || seen[p.id] !== undefined) return;
      seen[p.id] = i;
      order.push(p);
    });

    /* a lone project needs no switcher */
    if (order.length < 2) { host.style.display = "none"; return; }
    host.style.display = "";

    order.forEach(function (p) {
      var b = el("button", "proj");
      b.type = "button";
      b.setAttribute("data-id", p.id);
      b.appendChild(document.createTextNode(p.title || p.id));
      if (p.badge) {
        var t = el("span", "tag");
        t.textContent = p.badge;
        b.appendChild(t);
      }
      b.addEventListener("click", function () { go(seen[p.id], true); });
      host.appendChild(b);
    });
  }

  function syncProjectNav(p) {
    var host = $("projectNav");
    if (!host || !p) return;
    var btns = host.getElementsByTagName("button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle("on", btns[i].getAttribute("data-id") === p.id);
    }
  }

  /* ------------------------------------------------------------- archive */

  /* The strip below the fold is the index of everything released - the
     projects on the reel included. It is what makes the page scrollable at
     all, and it grows on its own as projects ship. */
  function buildArchive(projects) {
    var rest = projects.filter(isReleased);
    if (!rest.length) return false;

    var rail = $("rail");
    rail.innerHTML = "";
    var onStage = {};
    state.slides.forEach(function (s, i) {
      if (s._p && s._p.id && onStage[s._p.id] === undefined) onStage[s._p.id] = i;
    });

    rest.forEach(function (p) {
      var href = p.play || p.url || "#";
      var card = el("a", "card");
      card.href = href;
      var cover = asset(p, p.cover || (p.screens && p.screens[0]));
      if (cover) {
        var img = el("img");
        img.src = cover + ver();
        img.alt = "";
        img.loading = "lazy";
        img.onerror = function () { this.remove(); };
        card.appendChild(img);
      }
      if (p.status) {
        var kick = el("div", "card-kicker");
        kick.textContent = p.status;
        card.appendChild(kick);
      }
      if (p.badge) {
        var bg = el("div", "card-badge");
        bg.textContent = p.badge;
        card.appendChild(bg);
      }
      var body = el("div", "card-body");
      var b = el("b"); b.textContent = p.title || p.id;
      var sp = el("span"); sp.textContent = p.short || p.description || "";
      body.appendChild(b); body.appendChild(sp);
      card.appendChild(body);
      rail.appendChild(card);
    });

    $("archiveCount").textContent = rest.length + (rest.length > 1 ? " projects" : " project");
    $("archive").hidden = false;
    $("foot").hidden = false;
    document.documentElement.classList.add("has-more");
    document.body.classList.add("has-more");
    return true;
  }

  /* ----------------------------------------------------------------- boot */

  function bindInput() {
    $("prev").addEventListener("click", function () { go(state.index - 1, true); });
    $("next").addEventListener("click", function () { go(state.index + 1, true); });

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { go(state.index + 1, true); }
      else if (e.key === "ArrowLeft") { go(state.index - 1, true); }
    });

    var stage = $("stage");

    /* Pause only while the pointer is actually on something readable or
       clickable. The stage fills the whole viewport, so pausing on the stage
       itself would freeze the reel for anyone whose cursor sits on the page. */
    var HOLD = ".slide-inner, .cta, .nav, .cue, .mark-corner";
    function holds(node) {
      while (node && node !== stage) {
        if (node.matches && node.matches(HOLD)) return true;
        node = node.parentNode;
      }
      return false;
    }
    stage.addEventListener("mouseover", function (e) { state.paused = holds(e.target); });
    stage.addEventListener("mouseleave", function () { state.paused = false; });

    var x0 = null, y0 = null;
    stage.addEventListener("touchstart", function (e) {
      if (!e.touches.length) return;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    stage.addEventListener("touchend", function (e) {
      if (x0 === null || !e.changedTouches.length) return;
      var dx = e.changedTouches[0].clientX - x0;
      var dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy)) {
        go(state.index + (dx < 0 ? 1 : -1), true);
      }
      x0 = null; y0 = null;
    }, { passive: true });

    document.addEventListener("visibilitychange", function () {
      state.paused = document.hidden;
    });

    var cue = $("cue");
    if (cue) {
      cue.addEventListener("click", function () {
        var a = $("archive");
        if (a) a.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    /* once they have scrolled, they know there is more - stop offering */
    window.addEventListener("scroll", function () {
      if (state.cueSeen) return;
      if (window.pageYOffset > 40) {
        state.cueSeen = true;
        if (cue) cue.classList.remove("show");
      }
    }, { passive: true });
  }

  /* The opening card is a real wait, not a staged one: it holds until the
     first backdrop has decoded, so the stage is never revealed on an empty
     frame. A floor keeps it from flashing past on a warm cache, a ceiling
     keeps a slow network from parking the visitor on a black screen. */
  var INTRO_MIN = 900, INTRO_MAX = 4000;

  function runIntro(firstImage) {
    var intro = $("intro");
    var t0 = Date.now();
    var done = false;

    function finish() {
      if (done) return;
      done = true;
      intro.classList.add("done");
      document.body.classList.add("lit");
      setTimeout(function () { if (intro.parentNode) intro.parentNode.removeChild(intro); }, 1000);
    }

    function release() {
      var waited = Date.now() - t0;
      if (waited >= INTRO_MIN) finish();
      else setTimeout(finish, INTRO_MIN - waited);
    }

    if (reduced) {
      intro.style.transition = "none";
      finish();
      return;
    }

    setTimeout(finish, INTRO_MAX);       /* never hold longer than this */

    if (!firstImage) { release(); return; }

    var probe = new Image();
    probe.onload = probe.onerror = release;
    probe.src = firstImage;
    if (probe.complete) release();
  }

  /* Which build is this?
     `generated` is stamped into index.html by the catalog builder, so it can
     never be out of step with the page you are looking at - unlike
     version.js, which is a separate request the browser may cache on its own.
     Printed to the console, written into the footer, and readable at any time
     with SPINVIEW_BUILD in the console. */
  function stampBuild(cat) {
    var gen = (cat && cat.generated) ? String(cat.generated).replace("T", " ").slice(0, 16) : "?";
    var v = window.SPINVIEW_VERSION || "local";

    window.SPINVIEW_BUILD = { version: v, generated: gen };

    var nodes = document.querySelectorAll(".build-stamp");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = "\u00b7 " + v + " \u00b7 " + gen;
      nodes[i].title = "Build " + v + ", catalog generated " + gen;
    }
    try { console.log("[SpinView] build " + v + " \u00b7 catalog " + gen); } catch (e) {}
  }

  function boot() {
    var cat = SPINVIEW_CATALOG;
    var y = String(new Date().getFullYear());
    $("year").textContent = y;
    $("yearTop").textContent = y;

    stampBuild(cat);
    /* version.js is injected asynchronously - restamp once it has landed */
    window.addEventListener("load", function () { stampBuild(cat); });

    if (!cat || !cat.projects) {
      console.error("[SpinView] catalog missing or malformed");
      runIntro("");
      return;
    }

    var projects = pickProjects(cat);

    var stars = projects
      .filter(function (p) { return p.featured && isReleased(p); })
      .sort(function (a, b) {
        return (a.featured_order || 999) - (b.featured_order || 999);
      });

    if (!stars.length) {
      /* nothing released yet: fall back to anything released, then anything */
      stars = projects.filter(isReleased).slice(0, 1);
    }

    var deep = readDeepLink();
    if (deep.project) {
      var hit = null;
      for (var d = 0; d < projects.length; d++) {
        if (String(projects[d].id).toLowerCase() === deep.project) { hit = projects[d]; break; }
      }
      /* a direct link wins over the featured/released filter */
      if (hit && stars.indexOf(hit) < 0) stars.unshift(hit);
    }

    stars.forEach(function (p) {
      state.slides = state.slides.concat(slidesFor(p));
    });

    if (!state.slides.length) {
      console.warn("[SpinView] no released project to feature");
      runIntro("");
      return;
    }

    /* position of each slide inside its own project */
    var counts = {};
    state.slides.forEach(function (s) {
      var id = (s._p && s._p.id) || "";
      counts[id] = (counts[id] || 0) + 1;
      s._n = counts[id];
    });
    state.slides.forEach(function (s) {
      s._of = counts[(s._p && s._p.id) || ""];
    });

    dealImages(null);
    buildBackgrounds();
    buildSlides();
    buildDots();
    buildProjectNav();
    bindInput();
    buildArchive(projects);

    var start = findDeep(deep);
    go(start > 0 ? start : 0, false);

    var firstShot = state.slides[state.index] && state.slides[state.index].image;
    runIntro(firstShot ? firstShot + ver() : "");

    /* let #hash changes move the stage without a reload */
    window.addEventListener("hashchange", function () {
      var t = findDeep(readDeepLink());
      if (t >= 0) {
        urlLock = true;
        go(t, true);
        urlLock = false;
      }
    });

    /* warm the segmentation shot early - it drives an animation, so it must
       be decoded before its slide comes up */
    state.slides.forEach(function (sl) {
      if (sl.kind === "segmentation" && sl.image) {
        var w = new Image();
        w.src = sl.image + ver();
      }
    });

    /* warm the next background so the cross-fade is clean */
    if (state.slides[1] && state.slides[1].image) {
      var pre = new Image();
      pre.src = state.slides[1].image + ver();
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
