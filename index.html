     same pass, and never the shot that slide just had. skip keeps the
     slide currently on screen untouched. */
  function dealImages(skip) {
    var used = {};
    var i, k, bag, pick;

    for (i = 0; i < state.slides.length; i++) {
      if (!state.slides[i].pool) used[state.slides[i].image] = true;
    }
    if (skip != null && state.slides[skip]) used[state.slides[skip].image] = true;

    for (i = 0; i < state.slides.length; i++) {
      var sl = state.slides[i];
      if (!sl.pool || i === skip) continue;

      bag = shuffled(sl.pool);
      pick = null;
      for (k = 0; k < bag.length; k++) {
        if (!used[bag[k]] && bag[k] !== sl.image) { pick = bag[k]; break; }
      }
      if (!pick) {
        for (k = 0; k < bag.length; k++) if (!used[bag[k]]) { pick = bag[k]; break; }
      }
      if (!pick) pick = bag[0];

      used[pick] = true;
      sl.image = pick;
      if (sl._img && sl._img.getAttribute("src") !== pick + ver()) {
        /* a swapped file has to earn its fade again */
        sl._img.classList.remove("ready");
        sl._img.src = pick + ver();
      }
    }
  }

  /* "App · Live" when a project declares no kicker of its own. */
  function kickerFor(p) {
    var a = p.collection || p.type || "";
    var b = p.status || "";
    var t = function (x) { return x ? x.charAt(0).toUpperCase() + x.slice(1) : ""; };
    return [t(a), t(b)].filter(Boolean).join(" \u00b7 ");
  }

  /* Every slide has to say whose slide it is. When the headline already
     carries the project name (a title card), the kicker stays as written;
     otherwise the project name is prefixed onto it. */
  function ownedKicker(p, kicker, title) {
    var name = String(p.title || "");
    if (!name) return kicker;
    var low = name.toLowerCase();
    if (String(title || "").toLowerCase().indexOf(low) >= 0) return kicker;
    if (String(kicker || "").toLowerCase().indexOf(low) >= 0) return kicker;
    return kicker ? (name + " \u00b7 " + kicker) : name;
  }

  /* Turn a project into an array of stage slides. A project may declare its
     own `slides`; otherwise one slide is derived from its base fields. */
  function slidesFor(p) {
    var out = [];
    var list = p.slides && p.slides.length ? p.slides : null;

    if (!list) {
      out.push({
        _p: p,
        kind: "hero",
        image: asset(p, p.cover || (p.screens && p.screens[0])),
        pool: resolvePool(p, p.pool),
        focus: "50% 45%",
        lift: p.lift || 0,
        halo: (p.halo != null ? p.halo : 1),
        scrim: (p.scrim != null ? p.scrim : 1),
        kicker: p.featured_kicker || kickerFor(p),
        badge: p.badge || "",
        title: p.title,
        text: p.description || p.short || "",
        actions: p.play ? [{ label: p.play_label || ("Open " + p.title), href: p.play, primary: true }] : []
      });
      return out;
    }

    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      out.push({
        _p: p,
        id: s.id || (p.id + "-" + i),
        kind: s.kind || "hero",
        image: asset(p, s.image),
        pool: resolvePool(p, s.pool),
        focus: s.focus || "50% 45%",
        lift: s.lift || p.lift || 0,
        halo: (s.halo != null ? s.halo : (p.halo != null ? p.halo : 1)),
        scrim: (s.scrim != null ? s.scrim : (p.scrim != null ? p.scrim : 1)),
        kicker: ownedKicker(p, s.kicker || p.featured_kicker || "", s.title || p.title),
        badge: s.badge !== undefined ? s.badge : (p.badge || ""),
        title: s.title || p.title,
        text: s.text || "",
        chips: s.chips || [],
        stats: s.stats || [],
        readout: s.readout || "",
        actions: s.actions || []
      });
    }
    return out;
  }

  /* ------------------------------------------------------------ rendering */

  var state = {
    slides: [],
    index: 0,
    timer: null,
    tick: null,
    started: 0,
    paused: false,
    cueSeen: false,
    exitTo: null,      /* where a released drag wants the outgoing slide to land */
    armed: false,      /* the clock only starts once the intro is out of the way */
    firstRun: true     /* the opening slide gets a shorter hold */
  };

  /* The very first move happens quickly, so a visitor landing on the page
     sees within a couple of seconds that this is a reel and not a still.
     Every slide after that runs at its own reading pace. */
  var FIRST_DWELL = 3400;

  function words(t) {
    t = String(t || "").trim();
    return t ? t.split(/\s+/).length : 0;
  }

  /* How long a slide holds. A slide is on screen for as long as it takes to
     read it, not for a fixed beat: the opening card is a hook and gets out of
     the way fast, a dense card lingers. A slide may override this with
     "duration" (milliseconds) in project.json. */
  function durationFor(s) {
    if (s.duration) return s.duration;

    var n = words(s.title) + words(s.text);
    if (s.chips) n += words(s.chips.join(" "));

    var d = 3200 + n * 210;

    if (s.kind === "segmentation") {
      d += 4200;                       /* the clusters take ~3.2s to assemble */
    } else if (s.kind === "features") {
      var f = (s._p && s._p.features) ? s._p.features.length : 0;
      d += 1500 + f * 340;
    }

    return Math.max(5200, Math.min(d, 12000));
  }

  function buildBackgrounds() {
    var layer = $("bgLayer");
    layer.innerHTML = "";
    state.slides.forEach(function (s, i) {
      var wrap = el("div", "bg-shot");
      if (s.kind === "segmentation") wrap.className += " muted";
      if (s.image) {
        var img = el("img");
        img.alt = "";
        img.decoding = "async";
        /* "lazy" on a carousel means the file only starts downloading once
           the slide is already on screen, which is exactly the pop-in.
           The first few are fetched up front; the rest are warmed in the
           background by warmShots() once the page is up. */
        img.loading = i < 3 ? "eager" : "lazy";
        if (i === 0) { try { img.fetchPriority = "high"; } catch (e) {} }
        img.style.objectPosition = s.focus;
        /* a dark screenshot needs a lift before the scrim buries it */
        if (s.lift) img.style.filter = "brightness(" + s.lift + ") saturate(1.12)";
        /* A shot that 404s is dropped from its pool and replaced, so one
           file missing from a deploy cannot leave a slide on black. */
        img.onerror = function () {
          var dead = s.image;
          if (s.pool && s.pool.length > 1) {
            s.pool = s.pool.filter(function (u) { return u !== dead; });
            try { console.warn("[SpinView] missing " + dead + " - dropped from pool"); } catch (e) {}
            dealImages(null);
          } else {
            try { console.warn("[SpinView] missing " + dead); } catch (e) {}
            this.remove();
          }
        };
        /* the class is what fades it in; it goes on only once pixels exist */
        img.addEventListener("load", function () { this.classList.add("ready"); });
        img.src = s.image + ver();
        if (img.complete && img.naturalWidth) img.classList.add("ready");
        wrap.appendChild(img);
        s._img = img;
      }
      layer.appendChild(wrap);
      s._bg = wrap;
    });
  }

  /* Primary action: whatever the slide declares, else the project's own
     launch link. It is therefore identical across a project's slides, which
     is the whole point - the button must not move or vanish. */
  function ctaFor(s) {
    var p = s._p || {};
    var acts = s.actions || [];
    var primary = null, extras = [];

    /* the project's own launch link wins, so the label and the width are
       identical on every one of its slides */
    if (p.play) {
      primary = { label: p.play_label || ("Open " + (p.title || "")), href: p.play, primary: true };
    }
    for (var i = 0; i < acts.length; i++) {
      if (primary && acts[i].href === primary.href) continue;
      if (!primary && acts[i].primary) { primary = acts[i]; continue; }
      extras.push(acts[i]);
    }
    return { primary: primary, extras: extras };
  }

  function renderCta(s) {
    var host = $("cta");
    if (!host) return;
    var cfg = ctaFor(s);
    host.innerHTML = "";
    if (!cfg.primary && !cfg.extras.length) return;

    var wrap = el("div", "cta-inner");

    function mk(a, cls) {
      var node;
      if (a.href) { node = el("a", cls); node.href = a.href; }
      else {
        node = el("button", cls);
        node.type = "button";
        node.addEventListener("click", function () {
          var t = indexOfSlideId(a.slide);
          if (t >= 0) go(t, true);
        });
      }
      node.textContent = a.label || "Open";
      return node;
    }

    if (cfg.primary) wrap.appendChild(mk(cfg.primary, "btn primary"));
    cfg.extras.forEach(function (a) { wrap.appendChild(mk(a, "btn ghost")); });
    host.appendChild(wrap);
  }

  function indexOfSlideId(id) {
    if (!id) return -1;
    for (var i = 0; i < state.slides.length; i++) {
      if (state.slides[i].id === id) return i;
    }
    return -1;
  }

  /* Kicker line, optionally carrying a status badge ("Beta", "Preview"...). */
  function kickerNode(s, extraClass) {
    if (!s.kicker && !s.badge) return null;
    var k = el("div", "kicker" + (extraClass || ""));
    if (s.kicker) {
      var t = el("span");
      t.textContent = s.kicker;
      k.appendChild(t);
    }
    if (s.badge) {
      var b = el("span", "badge");
      b.textContent = s.badge;
      k.appendChild(b);
    }
    return k;
  }

  function heroSlide(s) {
    var inner = el("div", "slide-inner");
    var k = kickerNode(s, " anim"); if (k) inner.appendChild(k);
    var h = el("h1", "title anim");
    h.innerHTML = markTitle(s.title);
    inner.appendChild(h);
    if (s.text) { var p = el("p", "blurb anim"); p.textContent = s.text; inner.appendChild(p); }
    return inner;
  }

  function revealSlide(s) {
    var inner = el("div", "slide-inner");
    var k = kickerNode(s, " anim"); if (k) inner.appendChild(k);
    var h = el("h1", "title anim");
    h.innerHTML = markTitle(s.title);
    inner.appendChild(h);
    if (s.text) { var p = el("p", "blurb anim"); p.textContent = s.text; inner.appendChild(p); }
    return inner;
  }

  function featureSlide(s) {
    var inner = el("div", "slide-inner");
    var k = kickerNode(s, " anim"); if (k) inner.appendChild(k);
    var h = el("h1", "title anim");
    h.innerHTML = markTitle(s.title);
    inner.appendChild(h);
    if (s.text) { var p = el("p", "blurb anim"); p.textContent = s.text; inner.appendChild(p); }

    var feats = (s._p && s._p.features) || [];
    if (feats.length) {
      var grid = el("div", "feature-grid anim");
      feats.forEach(function (f) {
        var cell = el("div", "feature");
        var b = el("b"); b.textContent = f.title || "";
        var sp = el("span"); sp.textContent = f.text || "";
        cell.appendChild(b); cell.appendChild(sp);
        grid.appendChild(cell);
      });
      inner.appendChild(grid);
    }
    return inner;
  }

  /* The cluster viewer: the segmentation shot is assembled cell by cell,
     the gaps close, and the readout completes. */
  /* 182 tiles each painting a scaled copy of the same JPEG is heavy on a
     phone GPU, so the grid is coarser on small screens. */
  var SEG_COLS = 14, SEG_ROWS = 13;
  try {
    if (window.innerWidth <= 620) { SEG_COLS = 9; SEG_ROWS = 8; }
    else if (window.innerWidth <= 900) { SEG_COLS = 11; SEG_ROWS = 10; }
  } catch (e) {}

  function segSlide(s) {
    var inner = el("div", "slide-inner");

    var copy = el("div", "seg-copy anim");
    var segK = kickerNode(s, ""); if (segK) copy.appendChild(segK);
    var h = el("h2", "title"); h.innerHTML = markTitle(s.title); copy.appendChild(h);
    if (s.text) { var p = el("p", "blurb"); p.textContent = s.text; copy.appendChild(p); }
    if (s.chips && s.chips.length) {
      var chips = el("div", "chips");
      s.chips.forEach(function (c) {
        var chip = el("span", "chip"); chip.textContent = c; chips.appendChild(chip);
      });
      copy.appendChild(chips);
    }
    if (s.stats && s.stats.length) {
      var st = el("div", "chips");
      s.stats.forEach(function (x) {
        var chip = el("span", "chip");
        chip.textContent = (x.value ? x.value + " " : "") + (x.label || "");
        st.appendChild(chip);
      });
      copy.appendChild(st);
    }
    inner.appendChild(copy);

    var stage = el("div", "seg-stage anim");
    var grid = el("div", "seg-grid");
    grid.style.gridTemplateColumns = "repeat(" + SEG_COLS + ", 1fr)";
    grid.style.gridTemplateRows = "repeat(" + SEG_ROWS + ", 1fr)";

    var cx = (SEG_COLS - 1) / 2, cy = (SEG_ROWS - 1) / 2;
    var maxD = Math.sqrt(cx * cx + cy * cy);

    for (var y = 0; y < SEG_ROWS; y++) {
      for (var x = 0; x < SEG_COLS; x++) {
        var cell = el("div", "seg-cell");
        cell.style.backgroundImage = "url('" + s.image + ver() + "')";
        cell.style.backgroundSize = (SEG_COLS * 100) + "% " + (SEG_ROWS * 100) + "%";
        cell.style.backgroundPosition =
          (SEG_COLS > 1 ? (x / (SEG_COLS - 1)) * 100 : 0) + "% " +
          (SEG_ROWS > 1 ? (y / (SEG_ROWS - 1)) * 100 : 0) + "%";
        var d = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)) / maxD;
        /* centre-out wave with a touch of scatter so it never looks like a wipe */
        var jitter = ((x * 7 + y * 13) % 5) * 0.028;
        cell.style.animationDelay = (0.14 + d * 1.35 + jitter).toFixed(3) + "s";
        grid.appendChild(cell);
      }
    }
    var plate = el("div", "seg-plate");
    plate.style.backgroundImage = "url('" + s.image + ver() + "')";
    stage.appendChild(plate);
    stage.appendChild(grid);

    var scan = el("div", "seg-scan"); stage.appendChild(scan);

    var frame = el("div", "seg-frame");
    ["tl", "tr", "bl", "br"].forEach(function (c) {
      frame.appendChild(el("div", "seg-corner " + c));
    });
    stage.appendChild(frame);

    var hud = el("div", "seg-hud");
    var dot = el("span", "dot"); hud.appendChild(dot);
    var label = el("span"); label.textContent = s.readout || "Building cluster hierarchy";
    hud.appendChild(label);
    hud.appendChild(el("span", "grow"));
    var pct = el("span", "pct"); pct.textContent = "0%";
    hud.appendChild(pct);
    var bar = el("div", "seg-bar");
    hud.appendChild(bar);
    stage.appendChild(hud);

    inner.appendChild(stage);

    /* The cell animations are on a clock; the image is not. If the assembly
       starts before the file has decoded, every delay has already elapsed by
       the time pixels exist and the whole thing pops in at once - which is
       exactly what a slow phone shows. So we wait for the decode. */
    var probe = new Image();
    var ready = false;
    var waiting = null;
    function release() {
      if (ready) return;
      ready = true;
      if (waiting) { var f = waiting; waiting = null; f(); }
    }
    probe.onload = probe.onerror = release;
    probe.src = s.image + ver();
    if (probe.complete && probe.naturalWidth) ready = true;
    /* A load event that never arrives - a proxy stall, a dead file, an
       Android tab restored from the background - used to leave the assembly
       waiting forever and the slide showing an empty frame. It plays anyway
       after three seconds. */
    setTimeout(release, 3000);

    s._seg = {
      stage: stage, pct: pct, bar: bar, raf: null,
      isReady: function () { return ready; },
      onReady: function (fn) { if (ready) fn(); else waiting = fn; }
    };
    return inner;
  }

  function markTitle(t) {
    /* wrap *word* in a gradient span */
    return esc(t).replace(/\*(.+?)\*/g, "<em>$1</em>");
  }

  function segPlay(s) {
    var seg = s._seg;
    if (!seg) return;
    if (seg.onReady && !seg.isReady()) {
      seg.onReady(function () {
        if (state.slides[state.index] === s) segPlay(s);
      });
      return;
    }
    var stage = seg.stage;
    stage.classList.remove("play", "building", "solid");
    /* force reflow so the animation restarts */
    void stage.offsetWidth;
    stage.classList.add("play", "building");

    var total = reduced ? 2200 : 3200;
    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();

    if (seg.raf) cancelAnimationFrame(seg.raf);
    function step(now) {
      var t = Math.min(1, ((now || Date.now()) - t0) / total);
      var v = Math.round(t * 100);
      seg.pct.textContent = v + "%";
      seg.bar.style.width = v + "%";
      if (t < 1) {
        seg.raf = requestAnimationFrame(step);
      } else {
        seg.pct.textContent = "READY";
        stage.classList.remove("building");
        stage.classList.add("solid");
      }
    }
    seg.raf = requestAnimationFrame(step);
  }

  function segStop(s) {
    var seg = s._seg;
    if (!seg) return;
    if (seg.raf) cancelAnimationFrame(seg.raf);
    seg.stage.classList.remove("play", "building", "solid");
    seg.pct.textContent = "0%";
    seg.bar.style.width = "0%";
  }

  function buildSlides() {
    var host = $("slides");
    host.innerHTML = "";
    state.slides.forEach(function (s, i) {
      var node = el("section", "slide kind-" + s.kind);
      if (s.halo !== 1) node.style.setProperty("--halo", String(s.halo));
      node.setAttribute("role", "tabpanel");
      node.setAttribute("aria-label", (i + 1) + " of " + state.slides.length);
      var inner;
      if (s.kind === "segmentation")   inner = segSlide(s);
      else if (s.kind === "features")  inner = featureSlide(s);
      else if (s.kind === "reveal")    inner = revealSlide(s);
      else                             inner = heroSlide(s);
      node.appendChild(inner);
      host.appendChild(node);
      s._node = node;
    });
  }

  /* One run of dots per project, so the reel reads as "five of these,
     then one of those" rather than one undifferentiated row. */
  function buildDots() {
    var host = $("dots");
    host.innerHTML = "";
    var group = null, lastId = null;

    state.slides.forEach(function (s, i) {
      var pid = (s._p && s._p.id) || "";
      if (pid !== lastId) {
        group = el("div", "dot-group");
        host.appendChild(group);
        lastId = pid;
      }
      var b = el("button", "dot-btn");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-label", ((s._p && s._p.title) || "Slide") + " " + (s._n || (i + 1)));
      b.title = (s._p && s._p.title) || "";
      b.appendChild(el("i"));
      b.addEventListener("click", function () { go(i, true); });
      group.appendChild(b);
      s._dot = b;
    });
  }

  /* ------------------------------------------------------------- carousel */

  /* Which way the reel travels. Passed in by a drag (the direction of the
     gesture wins, even when it wraps); otherwise inferred, with the wrap at
     each end reading as a continuation rather than a rewind. */
  function directionFor(prev, next, n) {
    if (prev === next) return 1;
    if (prev === n - 1 && next === 0) return 1;
    if (prev === 0 && next === n - 1) return -1;
    return next > prev ? 1 : -1;
  }

  function go(i, manual, dir) {
    if (!state.slides.length) return;
    var n = state.slides.length;
    var next = ((i % n) + n) % n;
    var prev = state.index;
    if (dir == null) dir = directionFor(prev, next, n);

    var host = $("slides");
    host.classList.toggle("d-next", dir >= 0);
    host.classList.toggle("d-prev", dir < 0);

    /* Seat the incoming slide off-stage before it is shown. If a drag put it
       there already, its inline transform is left to be cleared below and the
       transition simply carries on from where the finger let go - no snap
       back to a keyframe's starting position. */
    var enter = state.slides[next]._node;
    var leave = state.slides[prev] && state.slides[prev]._node;
    enter.classList.remove("dragging");
    enter.style.opacity = "";
    if (prev !== next) {
      if (enter.style.transform) {
        enter.style.transform = "";
      } else {
        enter.classList.add("no-tr");
        enter.style.transform = "translate3d(" + (dir >= 0 ? "17%" : "-17%") + ", 0, 0)";
        void enter.offsetWidth;            /* commit that position, unanimated */
        enter.classList.remove("no-tr");
        enter.style.transform = "";
      }
    }
    if (leave && leave !== enter) {
      leave.classList.remove("dragging");
      leave.style.opacity = "";
      /* A drag can carry a slide further out than the class-driven exit
         position, and clearing the transform would then pull it *back*
         towards the middle before it left - which is exactly the rubber-band
         that makes a swipe feel like it was refused. exitTo is the drag's
         own, further, destination; it wins. */
      leave.style.transform = state.exitTo || "";
    }
    state.exitTo = null;

    state.slides.forEach(function (s, k) {
      var on = k === next;
      /* --p still holds ~100% from this dot's last run; clear it before the
         dot goes active or it flashes full for one frame */
      s._dot.style.setProperty("--p", "0%");
      if (on) s._node.classList.remove("leaving");
      s._node.classList.toggle("on", on);
      s._bg.classList.toggle("on", on);
      s._dot.classList.toggle("on", on);
      s._dot.classList.toggle("seen", !on && k < next);
      s._dot.setAttribute("aria-selected", on ? "true" : "false");
      if (!on && s.kind === "segmentation" && k === prev) segStop(s);
    });

    /* let the outgoing copy play its exit before it is dropped */
    if (prev !== next && state.slides[prev]) {
      var out = state.slides[prev]._node;
      out.classList.add("leaving");
      if (out._exit) clearTimeout(out._exit);
      out._exit = setTimeout(function () {
        out.classList.remove("leaving");
        out.style.transform = "";
        out.style.opacity = "";
      }, 900);
    }

    if (prev !== next) state.firstRun = false;

    state.index = next;

    $("counter").textContent =
      pad(state.slides[next]._n) + " / " + pad(state.slides[next]._of);

    syncProjectNav(state.slides[next]._p);

    /* a new pass gets a new set of backdrops, dealt behind the viewer */
    if (n > 1 && next === 0 && prev === n - 1) {
      setTimeout(function () { dealImages(0); }, 1600);
    }

    var sc = $("scrim");
    if (sc) sc.style.opacity = String(state.slides[next].scrim != null ? state.slides[next].scrim : 1);

    var cur = state.slides[next];
    if (cur.kind === "segmentation") segPlay(cur);
    renderCta(cur);
    if (manual) syncUrl(cur);
    updateCue(next, n);

    restart(manual);
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function updateCue(index, total) {
    var cue = $("cue");
    if (!cue) return;
    var show = !state.cueSeen && total > 0 && index === total - 1;
    cue.classList.toggle("show", show);
  }

  /* Reflect the project the viewer is on, so the address bar can be copied.
     Only on deliberate navigation - autoplay never rewrites the URL. */
  var urlLock = false;
  function syncUrl(slide) {
    if (urlLock) return;
    if (!window.history || !history.replaceState) return;
    var id = (slide._p && slide._p.id) || "";
    if (!id) return;
    try {
      history.replaceState(null, "", location.pathname + "?" + encodeURIComponent(id));
    } catch (e) {}
  }

  function restart(manual) {
    stopTimer();
    if (!state.armed) return;
    if (state.slides.length < 2) return;
    state.started = Date.now();
    var s = state.slides[state.index];
    var d = state.firstRun ? FIRST_DWELL : durationFor(s);

    state.tick = setInterval(function () {
      if (state.paused) { state.started += 60; return; }
      var p = Math.min(100, ((Date.now() - state.started) / d) * 100);
      s._dot.style.setProperty("--p", p + "%");
      if (p >= 100) { stopTimer(); go(state.index + 1); }
    }, 60);
    if (manual) { /* no-op, kept for clarity */ }
  }

  function stopTimer() {
    if (state.tick) { clearInterval(state.tick); state.tick = null; }
  }

  /* ------------------------------------------------------- project switcher */

  function buildProjectNav() {
    var host = $("projectNav");
    if (!host) return;
    host.innerHTML = "";

    var seen = {}, order = [];
    state.slides.forEach(function (s, i) {
      var p = s._p;
      if (!p || seen[p.id] !== undefined) return;
      seen[p.id] = i;
      order.push(p);
    });

    /* a lone project needs no switcher */
    if (order.length < 2) { host.style.display = "none"; return; }
    host.style.display = "";

    order.forEach(function (p) {
      var b = el("button", "proj");
      b.type = "button";
      b.setAttribute("data-id", p.id);
      b.appendChild(document.createTextNode(p.title || p.id));
      if (p.badge) {
        var t = el("span", "tag");
        t.textContent = p.badge;
        b.appendChild(t);
      }
      b.addEventListener("click", function () { go(seen[p.id], true); });
      host.appendChild(b);
    });
  }

  function syncProjectNav(p) {
    var host = $("projectNav");
    if (!host || !p) return;
    var btns = host.getElementsByTagName("button");
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute("data-id") === p.id;
      btns[i].classList.toggle("on", on);
      /* if the row has had to scroll, keep the active name in view - set
         scrollLeft directly so the page itself is never scrolled */
      if (on && host.scrollWidth > host.clientWidth + 2) {
        host.scrollLeft = Math.max(0,
          btns[i].offsetLeft - (host.clientWidth - btns[i].offsetWidth) / 2);
      }
    }
  }

  /* On a narrow screen the switcher and the wordmark fight for the top row.
     Navigation wins: the wordmark steps aside rather than the project names
     being truncated. The intro has already shown the name anyway. */
  function fitChrome() {
    var mark = document.querySelector(".mark-corner");
    var nav = $("projectNav");
    if (!mark || !nav) return;
    document.body.classList.remove("tight");
    if (nav.style.display === "none" || !nav.children.length) return;
    var m = mark.getBoundingClientRect();
    var n = nav.getBoundingClientRect();
    if (n.left < m.right + 14) document.body.classList.add("tight");
  }

  /* ------------------------------------------------------------- archive */

  /* The strip below the fold is the index of everything released - the
     projects on the reel included. It is what makes the page scrollable at
     all, and it grows on its own as projects ship. */
  function buildArchive(projects) {
    var rest = projects.filter(isReleased);
    if (!rest.length) return false;

    var rail = $("rail");
    rail.innerHTML = "";
    var onStage = {};
    state.slides.forEach(function (s, i) {
      if (s._p && s._p.id && onStage[s._p.id] === undefined) onStage[s._p.id] = i;
    });

    rest.forEach(function (p) {
      var href = p.play || p.url || "#";
      var card = el("a", "card");
      card.href = href;
      var cover = asset(p, p.cover || (p.screens && p.screens[0]));
      if (cover) {
        var img = el("img");
        img.src = cover + ver();
        img.alt = "";
        img.loading = "lazy";
        img.onerror = function () { this.remove(); };
        card.appendChild(img);
      }
      if (p.status) {
        var kick = el("div", "card-kicker");
        kick.textContent = p.status;
        card.appendChild(kick);
      }
      if (p.badge) {
        var bg = el("div", "card-badge");
        bg.textContent = p.badge;
        card.appendChild(bg);
      }
      var body = el("div", "card-body");
      var b = el("b"); b.textContent = p.title || p.id;
      var sp = el("span"); sp.textContent = p.short || p.description || "";
      body.appendChild(b); body.appendChild(sp);
      card.appendChild(body);
      rail.appendChild(card);
    });

    $("archiveCount").textContent = rest.length + (rest.length > 1 ? " projects" : " project");
    $("archive").hidden = false;
    $("foot").hidden = false;
    document.documentElement.classList.add("has-more");
    document.body.classList.add("has-more");
    return true;
  }

  /* ----------------------------------------------------------------- boot */

  function bindInput() {
    $("prev").addEventListener("click", function () { go(state.index - 1, true); });
    $("next").addEventListener("click", function () { go(state.index + 1, true); });

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { go(state.index + 1, true); }
      else if (e.key === "ArrowLeft") { go(state.index - 1, true); }
    });

    var stage = $("stage");
    var bgHost = $("bgLayer");

    /* Hover-to-pause, but only where hovering is a thing. A touch browser
       synthesises a mouseover on tap and then never sends the matching
       mouseleave - so one tap latched state.paused true and the reel stopped
       advancing for the rest of the visit. That is the frozen counter. */
    var canHover = false;
    try {
      canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    } catch (e) {}

    if (canHover) {
      /* Pause only while the pointer is actually on something readable or
         clickable. The stage fills the whole viewport, so pausing on the stage
         itself would freeze the reel for anyone whose cursor sits on the page. */
      var HOLD = ".slide-inner, .cta, .nav, .cue, .mark-corner";
      var holds = function (node) {
        while (node && node !== stage) {
          if (node.matches && node.matches(HOLD)) return true;
          node = node.parentNode;
        }
        return false;
      };
      stage.addEventListener("mouseover", function (e) { state.paused = holds(e.target); });
      stage.addEventListener("mouseleave", function () { state.paused = false; });
    }

    /* ---- tap anywhere in the scene: next slide ------------------------- */
    /* Anything that already does something of its own is left alone. */
    var SKIP = "a, button, input, select, textarea, [role='button'], .cta, .nav, .cue, .projects, .mark-corner";
    var noTapUntil = 0;

    stage.addEventListener("click", function (e) {
      if (Date.now() < noTapUntil) return;      /* that click was the end of a drag */
      var node = e.target;
      while (node && node !== stage) {
        if (node.matches && node.matches(SKIP)) return;
        node = node.parentNode;
      }
      go(state.index + 1, true);
    });

    /* ---- drag the reel ------------------------------------------------- */
    /* Two slides move under the finger: the one you are on, and the one you
       are pulling in from the far edge. Released past the threshold neither
       of them goes back - the outgoing keeps travelling the way the gesture
       was going and the incoming completes its arrival. Released short, both
       ease home. Because the hand-over is a CSS transition and not a
       keyframe, the slide carries on from exactly where the finger left it. */
    var x0 = null, y0 = null, axis = null, moved = false, peer = -1;

    function stageW() { return stage.clientWidth || window.innerWidth || 1; }

    function loosen(s) {
      if (!s || !s._node) return;
      s._node.classList.remove("dragging");
      s._node.style.transform = "";
      s._node.style.opacity = "";
    }

    function dragTo(dx) {
      var n = state.slides.length, w = stageW();
      var want = ((((dx < 0 ? state.index + 1 : state.index - 1) % n) + n) % n);
      if (peer !== want) {
        if (peer >= 0 && peer !== state.index) loosen(state.slides[peer]);
        peer = want;
      }
      var cur = state.slides[state.index];
      var other = state.slides[peer];
      var t = Math.min(1, Math.abs(dx) / (w * 0.55));   /* 0 -> 1 across the gesture */
      var shift = dx * 0.62;                            /* a little resistance */

      cur._node.classList.add("dragging");
      cur._node.style.transform = "translate3d(" + shift.toFixed(1) + "px,0,0)";
      cur._node.style.opacity = (1 - t * 0.6).toFixed(3);

      if (other && other !== cur) {
        var park = (dx < 0 ? 1 : -1) * w * 0.55;        /* waiting off the edge */
        other._node.classList.add("dragging");
        other._node.style.transform = "translate3d(" + (park + shift).toFixed(1) + "px,0,0)";
        other._node.style.opacity = Math.min(1, t * 1.25).toFixed(3);
      }
      if (bgHost) bgHost.style.transform = "translate3d(" + (dx * 0.16).toFixed(1) + "px,0,0)";
    }

    stage.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) return;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      axis = null; moved = false; peer = -1;
      if (bgHost) bgHost.classList.remove("settle");
    }, { passive: true });

    stage.addEventListener("touchmove", function (e) {
      if (x0 === null || !e.touches.length) return;
      var dx = e.touches[0].clientX - x0;
      var dy = e.touches[0].clientY - y0;
      if (axis === null) {
        /* wait until the gesture has an opinion, so a vertical scroll is
           never stolen by the carousel */
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? "x" : "y";
      }
      if (axis !== "x") return;
      moved = true;
      state.paused = true;
      dragTo(dx);
    }, { passive: true });

    function endDrag(e) {
      if (x0 === null) return;
      var dx = (e.changedTouches && e.changedTouches.length)
        ? e.changedTouches[0].clientX - x0 : 0;
      x0 = null; y0 = null;
      state.paused = false;

      if (bgHost) {
        bgHost.classList.add("settle");
        bgHost.style.transform = "";
        setTimeout(function () { bgHost.classList.remove("settle"); }, 520);
      }

      var committed = false;
      if (axis === "x" && moved) {
        noTapUntil = Date.now() + 700;
        var threshold = Math.max(50, Math.min(140, stageW() * 0.16));
        if (Math.abs(dx) > threshold && peer >= 0 && peer !== state.index) {
          /* Drop the no-transition flag but keep the transforms in place:
             go() clears them, and the browser transitions out of the held
             position instead of jumping. */
          var w = stageW();
          var held = dx * 0.62;                       /* where the finger left it */
          var out = dx < 0
            ? Math.min(held - w * 0.14, -w * 0.17)    /* keep going left */
            : Math.max(held + w * 0.14,  w * 0.17);   /* keep going right */
          state.exitTo = "translate3d(" + out.toFixed(1) + "px, 0, 0)";
          state.slides[state.index]._node.classList.remove("dragging");
          state.slides[peer]._node.classList.remove("dragging");
          go(peer, true, dx < 0 ? 1 : -1);
          committed = true;
        }
      }
      if (!committed) {
        loosen(state.slides[state.index]);
        if (peer >= 0) loosen(state.slides[peer]);
      }
      axis = null; moved = false; peer = -1;
    }
    stage.addEventListener("touchend", endDrag, { passive: true });
    stage.addEventListener("touchcancel", endDrag, { passive: true });

    document.addEventListener("visibilitychange", function () {
      state.paused = document.hidden;
    });

    var cue = $("cue");
    if (cue) {
      cue.addEventListener("click", function () {
        var a = $("archive");
        if (a) a.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    /* once they have scrolled, they know there is more - stop offering */
    window.addEventListener("scroll", function () {
      if (state.cueSeen) return;
      if (window.pageYOffset > 40) {
        state.cueSeen = true;
        if (cue) cue.classList.remove("show");
      }
    }, { passive: true });
  }

  /* The opening card is a real wait, not a staged one: it holds until the
     first backdrop has decoded, so the stage is never revealed on an empty
     frame. A floor keeps it from flashing past on a warm cache, a ceiling
     keeps a slow network from parking the visitor on a black screen. */
  var INTRO_MIN = 900, INTRO_MAX = 4000;

  function runIntro(firstImage) {
    var intro = $("intro");
    var t0 = Date.now();
    var done = false;

    function finish() {
      if (done) return;
      done = true;
      intro.classList.add("done");
      document.body.classList.add("lit");
      /* the opening slide's hold begins now - not while it was hidden behind
         the intro, which made the first move land at an unpredictable moment */
      state.armed = true;
      restart(false);
      setTimeout(function () { if (intro.parentNode) intro.parentNode.removeChild(intro); }, 1000);
    }

    function release() {
      var waited = Date.now() - t0;
      if (waited >= INTRO_MIN) finish();
      else setTimeout(finish, INTRO_MIN - waited);
    }

    /* the preference is about movement, not about skipping the wait for the
       first image - only the fade is dropped */
    if (reduced) intro.style.transition = "none";

    setTimeout(finish, INTRO_MAX);       /* never hold longer than this */

    if (!firstImage) { release(); return; }

    var probe = new Image();
    probe.onload = probe.onerror = release;
    probe.src = firstImage;
    if (probe.complete) release();
  }

  /* Which build is this?
     `generated` is stamped into index.html by the catalog builder, so it can
     never be out of step with the page you are looking at - unlike
     version.js, which is a separate request the browser may cache on its own.
     Printed to the console, written into the footer, and readable at any time
     with SPINVIEW_BUILD in the console. */
  function stampBuild(cat) {
    var gen = (cat && cat.generated) ? String(cat.generated).replace("T", " ").slice(0, 16) : "?";
    var v = window.SPINVIEW_VERSION || "local";

    window.SPINVIEW_BUILD = { version: v, generated: gen };

    var nodes = document.querySelectorAll(".build-stamp");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = "\u00b7 " + v + " \u00b7 " + gen;
      nodes[i].title = "Build " + v + ", catalog generated " + gen;
    }
    try { console.log("[SpinView] build " + v + " \u00b7 catalog " + gen); } catch (e) {}
  }

  /* ------------------------------------------------------------- build panel */

  /* The page's own identity is the catalog timestamp the builder stamped into
     this very file - not version.js, which is a separate request the browser
     caches on its own schedule and which can therefore describe a different
     build than the one you are reading. */
  function localBuild(cat) {
    return {
      version: window.SPINVIEW_VERSION || "local",
      generated: (cat && cat.generated) ? String(cat.generated).replace("T", " ").slice(0, 16) : "?"
    };
  }

  function openBuild(cat) {
    var panel = $("buildPanel");
    if (!panel) return;
    var me = localBuild(cat);
    $("bpLocal").textContent = me.version;
    $("bpGen").textContent = me.generated;
    $("bpServer").textContent = "...";
    var verdict = $("bpVerdict");
    verdict.className = "build-verdict wait";
    verdict.textContent = "Vérification…";
    panel.classList.add("show");
    panel.setAttribute("aria-hidden", "false");
    state.paused = true;

    if (!window.fetch) {
      verdict.className = "build-verdict err";
      verdict.textContent = "Navigateur trop ancien pour vérifier";
      return;
    }

    /* Ask for index.html itself, uncached. Its catalog stamp is the one thing
       that cannot disagree with the HTML it arrived in. */
    var bust = "cb=" + Date.now();
    var url = location.pathname + (location.pathname.slice(-1) === "/" ? "" : "") + "?" + bust;

    fetch(url, { cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        var g = /"generated"\s*:\s*"([^"]+)"/.exec(html);
        var live = g ? g[1].replace("T", " ").slice(0, 16) : "";
        return fetch("/version.txt?" + bust, { cache: "no-store" })
          .then(function (r) { return r.ok ? r.text() : ""; })
          .catch(function () { return ""; })
          .then(function (v) { return { gen: live, ver: (v || "").trim() }; });
      })
      .then(function (srv) {
        $("bpServer").textContent =
          (srv.ver || "?") + (srv.gen ? "  \u00b7  " + srv.gen : "");
        if (!srv.gen) {
          verdict.className = "build-verdict err";
          verdict.textContent = "Serveur injoignable";
        } else if (srv.gen === me.generated) {
          verdict.className = "build-verdict fresh";
          verdict.textContent = "À jour";
        } else {
          verdict.className = "build-verdict stale";
          verdict.textContent = "Version en cache — rechargez";
        }
      })
      .catch(function () {
        $("bpServer").textContent = "-";
        verdict.className = "build-verdict err";
        verdict.textContent = "Vérification impossible (hors ligne ?)";
      });
  }

  function closeBuild() {
    var panel = $("buildPanel");
    if (!panel) return;
    panel.classList.remove("show");
    panel.setAttribute("aria-hidden", "true");
    state.paused = false;
  }

  function bindBuild(cat) {
    var panel = $("buildPanel");
    if (!panel) return;

    $("bpClose").addEventListener("click", closeBuild);
    $("bpReload").addEventListener("click", function () {
      var go = function () {
        location.replace(location.pathname + "?fresh=" + Date.now());
      };
      /* a fresh URL defeats the HTTP cache; caches.delete() covers anything a
         service worker may have parked, now or later */
      if (window.caches && caches.keys) {
        caches.keys()
          .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
          .then(go, go);
      } else { go(); }
    });

    /* three taps on the slide counter - small, deliberate, never hit by
       accident, and visible on a phone */
    var counter = $("counter");
    if (counter) {
      var hits = 0, last = 0;
      counter.style.pointerEvents = "auto";
      counter.style.cursor = "pointer";
      counter.addEventListener("click", function (e) {
        e.stopPropagation();
        var now = Date.now();
        hits = (now - last < 700) ? hits + 1 : 1;
        last = now;
        if (hits >= 3) { hits = 0; openBuild(cat); }
      });
    }

    /* and /?build or /#build, which is the one that can be typed on a phone */
    var wants = /(^|[?&])build(=|&|$)/.test(location.search) ||
                /^#build$/i.test(location.hash || "");
    if (wants) setTimeout(function () { openBuild(cat); }, 900);
  }

  function boot() {
    var cat = SPINVIEW_CATALOG;
    var y = String(new Date().getFullYear());
    $("year").textContent = y;
    $("yearTop").textContent = y;

    stampBuild(cat);
    /* version.js is injected asynchronously - restamp once it has landed */
    window.addEventListener("load", function () { stampBuild(cat); });

    if (!cat || !cat.projects) {
      console.error("[SpinView] catalog missing or malformed");
      runIntro("");
      return;
    }

    var projects = pickProjects(cat);

    var stars = projects
      .filter(function (p) { return p.featured && isReleased(p); })
      .sort(function (a, b) {
        return (a.featured_order || 999) - (b.featured_order || 999);
      });

    if (!stars.length) {
      /* nothing released yet: fall back to anything released, then anything */
      stars = projects.filter(isReleased).slice(0, 1);
    }

    var deep = readDeepLink();
    if (deep.project) {
      var hit = null;
      for (var d = 0; d < projects.length; d++) {
        if (String(projects[d].id).toLowerCase() === deep.project) { hit = projects[d]; break; }
      }
      /* a direct link wins over the featured/released filter */
      if (hit && stars.indexOf(hit) < 0) stars.unshift(hit);
    }

    stars.forEach(function (p) {
      state.slides = state.slides.concat(slidesFor(p));
    });

    if (!state.slides.length) {
      console.warn("[SpinView] no released project to feature");
      runIntro("");
      return;
    }

    /* position of each slide inside its own project */
    var counts = {};
    state.slides.forEach(function (s) {
      var id = (s._p && s._p.id) || "";
      counts[id] = (counts[id] || 0) + 1;
      s._n = counts[id];
    });
    state.slides.forEach(function (s) {
      s._of = counts[(s._p && s._p.id) || ""];
    });

    dealImages(null);
    buildBackgrounds();
    buildSlides();
    buildDots();
    buildProjectNav();
    fitChrome();
    window.addEventListener("resize", fitChrome);
    window.addEventListener("orientationchange", function () {
      setTimeout(fitChrome, 120);
    });
    bindInput();
    bindBuild(cat);
    buildArchive(projects);

    var start = findDeep(deep);
    go(start > 0 ? start : 0, false);

    var firstShot = state.slides[state.index] && state.slides[state.index].image;
    runIntro(firstShot ? firstShot + ver() : "");

    /* let #hash changes move the stage without a reload */
    window.addEventListener("hashchange", function () {
      var t = findDeep(readDeepLink());
      if (t >= 0) {
        urlLock = true;
        go(t, true);
        urlLock = false;
      }
    });

    /* warm the segmentation shot early - it drives an animation, so it must
       be decoded before its slide comes up */
    state.slides.forEach(function (sl) {
      if (sl.kind === "segmentation" && sl.image) {
        var w = new Image();
        w.src = sl.image + ver();
      }
    });

    /* Warm every backdrop, one at a time, behind the reel. Sequential and
       not parallel on purpose: a phone on mobile data that fires nine
       requests at once finishes all of them late, including the one the
       viewer is about to need. */
    warmShots();
  }

  function warmShots() {
    var queue = [], seen = {};
    state.slides.forEach(function (s) {
      if (s.image && !seen[s.image]) { seen[s.image] = 1; queue.push(s.image); }
      (s.pool || []).forEach(function (u) {
        if (!seen[u]) { seen[u] = 1; queue.push(u); }
      });
    });
    var i = 0;
    (function next() {
      if (i >= queue.length) return;
      var im = new Image();
      im.onload = im.onerror = function () { setTimeout(next, 40); };
      im.src = queue[i++] + ver();
    })();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
