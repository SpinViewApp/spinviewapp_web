<style>
/* ============================================================
   SpinView - cinema shell
   One full-screen stage. Content comes from _data/catalog.json.
   ============================================================ */

:root {
  --bg:            #000000;
  --ink:           #ffffff;
  --ink-soft:      rgba(255,255,255,.72);
  --ink-faint:     rgba(255,255,255,.42);
  --line:          rgba(255,255,255,.16);
  --line-soft:     rgba(255,255,255,.09);

  --cyan:          #4dd6ff;
  --violet:        #9a6bff;
  --magenta:       #ff5ce1;
  --accent:        var(--cyan);

  --stage-pad-x:   clamp(22px, 6vw, 96px);
  --stage-pad-t:   96px;
  --stage-pad-b:   96px;
  /* the copy block is a fixed height, centred in the stage - so its lower
     edge sits at the same place on every slide, and the button pinned just
     under that edge never moves either */
  /* a floor as well as a proportion: on a short laptop 42vh is not enough
     to hold the feature grid, and the block would grow past the button */
  --copy-h:        max(420px, 42vh);
  --cta-gap:       34px;
  /* The copy block is centred on the padding box, so an asymmetric padding
     is what moves it off the middle of the stage. The button is positioned
     from the stage, not from the block, so it has to be told about the same
     offset or the two drift apart. */
  --copy-shift:    calc((var(--stage-pad-t) - var(--stage-pad-b)) / 2);
  /* one place to slow the whole reel down or speed it up */
  --swap:          .78s;

  --ease:          cubic-bezier(.22,.61,.36,1);
  --ease-out:      cubic-bezier(.16,1,.3,1);

  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* Pure full-screen by default. The archive below is only reachable
   when there is released content to scroll to (body.has-more). */
html, body { height: 100%; overflow: hidden; }
html.has-more, html.has-more body {
  height: auto;
  overflow-x: hidden;
  overflow-y: auto;
  scroll-behavior: smooth;
}

img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

::selection { background: rgba(77,214,255,.28); }

:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
  border-radius: 4px;
}

/* ------------------------------------------------------------------ intro */

#intro {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  background: #000;
  transition: opacity .85s var(--ease), visibility .85s;
}
#intro.done { opacity: 0; visibility: hidden; pointer-events: none; }

.intro-lockup {
  display: grid;
  justify-items: center;
  gap: clamp(16px, 2.6vh, 26px);
  opacity: 0;
  /* opacity only - a scale or width animation on a logo reads as a wobble */
  animation: introIn .7s var(--ease) .05s forwards;
}
.intro-word {
  font-size: clamp(11px, 1.5vw, 14px);
  font-weight: 500;
  letter-spacing: .62em;
  text-indent: .62em;
  color: rgba(255,255,255,.82);
}
.intro-rule {
  width: clamp(120px, 18vw, 230px);
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
  opacity: 0;
  animation: introIn .8s var(--ease) .28s forwards;
}
@keyframes introIn { to { opacity: 1; } }

/* ------------------------------------------------------------------ chrome */

.mark-corner {
  position: fixed;
  top: max(18px, env(safe-area-inset-top));
  left: max(18px, env(safe-area-inset-left));
  z-index: 60;
  display: flex;
  align-items: center;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity .7s var(--ease) .15s, transform .7s var(--ease) .15s;
}
body.lit .mark-corner { opacity: .5; transform: none; }
.mark-corner:hover, .mark-corner:focus-visible { opacity: 1 !important; }
.mark-corner span {
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .34em;
  text-indent: .34em;
  color: rgba(255,255,255,.9);
  text-shadow: 0 0 4px rgba(0,0,0,.9), 0 0 14px rgba(0,0,0,.7);
}

/* Project switcher. Doubles as the "whose slide is this" indicator, so the
   name never has to be repeated a third time in the chrome. */
body.tight .mark-corner { display: none; }

.projects {
  position: fixed;
  max-width: calc(100vw - 30px);
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  top: max(16px, env(safe-area-inset-top));
  right: max(18px, env(safe-area-inset-right));
  z-index: 60;
  display: flex;
  align-items: center;
  gap: clamp(14px, 2vw, 24px);
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity .7s var(--ease) .2s, transform .7s var(--ease) .2s;
}
body.lit .projects { opacity: 1; transform: none; }
.projects::-webkit-scrollbar { display: none; }

.proj {
  position: relative;
  padding: 5px 0 7px;
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .24em;
  text-indent: .24em;
  text-transform: uppercase;
  white-space: nowrap;
  color: rgba(255,255,255,.32);
  text-shadow: 0 0 3px rgba(0,0,0,.95), 0 0 10px rgba(0,0,0,.85), 0 0 24px rgba(0,0,0,.6);
  transition: color .3s var(--ease);
}
.proj:hover { color: rgba(255,255,255,.78); }
.proj.on { color: #fff; }
.proj::after {
  content: "";
  position: absolute;
  left: 0;
  right: .24em;
  bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--cyan), var(--magenta));
  box-shadow: 0 0 10px rgba(120,190,255,.55);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform .45s var(--ease);
}
.proj.on::after { transform: scaleX(1); }
.proj .tag {
  display: inline-block;
  margin-left: 7px;
  padding: 1px 4px;
  border: 1px solid rgba(255,196,107,.4);
  border-radius: 2px;
  font-size: 8px;
  letter-spacing: .1em;
  text-indent: .1em;
  color: #ffc46b;
  vertical-align: 1px;
}

/* ------------------------------------------------------------------- stage */

.stage {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
}

.bg-layer { position: absolute; inset: 0; z-index: 0; }

.bg-shot {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1.45s var(--ease);
  will-change: opacity, transform;
}
.bg-shot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 45%;
  transform: scale(1.12);
  /* A backdrop never snaps in. The <img> stays transparent until the file
     has actually decoded, then fades on its own clock - independent of the
     .bg-shot cross-fade, so a slow file arriving mid-slide still arrives
     softly instead of popping. */
  opacity: 0;
  transition: opacity .85s var(--ease);
}
.bg-shot img.ready { opacity: 1; }
.bg-shot.on { opacity: 1; }

/* The pan and the zoom run on the wrapper and on the image separately, with
   periods that do not divide into each other - so the pair never repeats the
   same frame and the motion reads as a slow camera rather than a loop. */
.bg-shot.on { animation: pan 23s ease-in-out infinite alternate; }
.bg-shot.on img { animation: zoom 31s ease-in-out infinite alternate; }

/* ±1.8% over 23s is a move you have to be told about. On a phone, where the
   frame is small and the picture is already dimmed, it read as a still. */
@keyframes pan {
  from { transform: translate3d(-3.2%, 1.8%, 0); }
  to   { transform: translate3d( 3.2%, -2.1%, 0); }
}
@keyframes zoom {
  from { transform: scale(1.08); }
  to   { transform: scale(1.26); }
}

/* dim the photo when the slide has its own visual (segmentation) */
.bg-shot.muted { filter: blur(26px) saturate(.55) brightness(.42); }

/* A full-screen blur on a layer that is also being panned has to be
   recomputed every single frame. That is what froze the backdrop on the
   cluster slide on Android - the compositor simply stopped keeping up. On
   touch hardware the same slide is pushed back with colour and exposure
   instead, and the camera keeps moving. */
@media (hover: none) {
  .bg-shot.muted { filter: saturate(.34) brightness(.3) contrast(1.1); }
  /* Blend modes are the other per-frame cost that phones pay badly for: an
     overlay layer the size of the viewport forces the whole stage through a
     second compositing pass on every single frame of the pan. */
  .stage .grain { mix-blend-mode: normal; opacity: .07; }
  .stage .aura  { mix-blend-mode: normal; opacity: .34; }
}

.scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  transition: opacity .9s var(--ease);
  background:
    radial-gradient(118% 80% at 50% 46%, rgba(0,0,0,.22) 0%, rgba(0,0,0,.66) 60%, rgba(0,0,0,.92) 100%),
    linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.18) 26%, rgba(0,0,0,.42) 62%, rgba(0,0,0,.94) 100%);
}
/* A slow light that crosses the frame behind the copy. This is the piece
   that stops a phone looking like a screenshot: the type stays perfectly
   still (moving it either steps pixels or goes soft), while the light it
   sits in keeps moving. It is one composited layer and nothing reflows. */
.aura {
  position: absolute;
  inset: -20%;
  z-index: 1;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: .5;
  background:
    radial-gradient(38% 46% at 50% 50%, rgba(77,214,255,.13) 0%, rgba(77,214,255,.05) 45%, transparent 72%),
    radial-gradient(30% 38% at 50% 50%, rgba(255,92,225,.09) 0%, transparent 70%);
  animation: auraDrift 27s ease-in-out infinite alternate;
  will-change: transform;
}
@keyframes auraDrift {
  from { transform: translate3d(-9%, 4%, 0) scale(1); }
  to   { transform: translate3d( 9%, -5%, 0) scale(1.16); }
}

.grain {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: .16;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.5'/></svg>");
}

/* ------------------------------------------------------------------ slides */

.slides {
  position: relative;
  z-index: 3;
  height: 100%;
  display: grid;
}
/* only the backdrop layer is dragged as a block, for parallax */
.bg-layer { will-change: transform; }
.bg-layer.settle { transition: transform .5s var(--ease-out); }
.slide {
  grid-area: 1 / 1;
  display: grid;
  align-content: center;
  justify-items: center;
  padding: var(--stage-pad-t) var(--stage-pad-x) var(--stage-pad-b);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translate3d(0, 0, 0);
  /* transform is a transition, not an animation, on purpose: a drag hands
     the slide over mid-flight and a transition carries on from wherever the
     finger left it. A keyframe animation would snap back to its `from`. */
  transition:
    opacity var(--swap) var(--ease),
    visibility var(--swap),
    transform var(--swap) var(--ease-out);
  will-change: transform, opacity;
  backface-visibility: hidden;
}
.slide.on { opacity: 1; visibility: visible; pointer-events: auto; transform: translate3d(0, 0, 0); }

/* while a finger is down the slide is placed by hand, frame by frame */
.slide.dragging { transition: none; visibility: visible; }
/* used for one frame to seat an incoming slide off-stage without animating */
.slide.no-tr { transition: none; }

/* The reel travels. The outgoing slide leaves the way the gesture was
   going and the incoming one arrives from the opposite edge, so the move
   has a direction instead of being a dissolve in place. */
.slides.d-next .slide.leaving { transform: translate3d(-17%, 0, 0); }
.slides.d-prev .slide.leaving { transform: translate3d( 17%, 0, 0); }

/* Leaving is its own state, not just the absence of .on: the copy sinks and
   fades on the way out instead of being cut. Without it the outgoing text
   simply stops existing, which is what reads as brutal. */
.slide.leaving { opacity: 0; visibility: visible; pointer-events: none; }
.slide.leaving .anim { animation: sink .62s var(--ease) forwards; }
.slide.leaving .anim:nth-child(1) { animation-delay: 0s; }
.slide.leaving .anim:nth-child(2) { animation-delay: .03s; }
.slide.leaving .anim:nth-child(3) { animation-delay: .16s; }
.slide.leaving .anim:nth-child(4) { animation-delay: .09s; }
.slide.leaving .kicker.anim,
.slide.leaving .seg-copy .kicker {
  animation: kickerOut .5s var(--ease) forwards;
}
@keyframes sink {
  to { opacity: 0; transform: translate3d(0, -16px, 0); }
}
@keyframes kickerOut {
  to { opacity: 0; transform: translate3d(24px, 0, 0); }
}

.slide-inner {
  position: relative;
  width: 100%;
  max-width: 820px;
  min-height: var(--copy-h);
  display: grid;
  align-content: center;
  justify-items: center;
  text-align: center;
  gap: clamp(14px, 2vh, 22px);
}

/* Legibility comes from the glyphs themselves: a black glow radiating from
   the letterforms, layered from tight to wide. It follows the shape of the
   text instead of dropping a dark panel over the picture, so the backdrop
   stays fully visible. --halo scales it per slide (0 removes it). */

/* No idle animation on the copy. A slow translation of large light type
   either steps in whole pixels or, once promoted to its own layer, goes
   soft - both were worse than a still frame. The life on screen comes from
   the backdrop, which drifts continuously behind the scrim. */

/* per-element entrance */
.slide .anim {
  opacity: 0;
  transform: translateY(16px);
}
.slide.on .anim {
  animation: riseIn 1.15s var(--ease-out) forwards;
}
.slide.on .anim:nth-child(1) { animation-delay: .10s; }

/* The kicker does not rise with the rest: it slides in from the left while
   its rule draws itself, then keeps drifting sideways for as long as the
   slide is up. It is small, letterspaced and glowing, so promoting it to its
   own layer costs nothing visible - which is what keeps the slow travel
   smooth instead of stepping a pixel at a time. */
.slide.on .kicker.anim,
.slide.on .seg-copy .kicker {
  will-change: transform;
  animation:
    kickerIn 1.05s var(--ease-out) .2s forwards,
    kickerDrift 15s ease-in-out 1.35s infinite,
    kickerPulse 6.5s ease-in-out 1.35s infinite;
}
@keyframes kickerIn {
  from { opacity: 0; transform: translate3d(-26px, 0, 0); }
  to   { opacity: 1; transform: none; }
}
/* starts and ends at zero, so it never jumps when it takes over from the entrance */
@keyframes kickerDrift {
  0%   { transform: translate3d(0, 0, 0); }
  50%  { transform: translate3d(9px, 0, 0); }
  100% { transform: translate3d(0, 0, 0); }
}
@keyframes kickerPulse {
  0%, 100% { filter: brightness(1); }
  50%      { filter: brightness(1.35); }
}
.kicker::before { transform: scaleX(0); transform-origin: left center; }
.slide.on .kicker::before {
  animation: ruleIn .9s var(--ease-out) .55s forwards;
}

/* The copy is never completely still. Six pixels over sixteen seconds is
   below the threshold where you can point at what moved - which is exactly
   the point: the page reads as live rather than as a screenshot, and the
   type is not travelling far enough or fast enough to soften. */
.slide.on .slide-inner {
  animation: copyDrift 17s ease-in-out 1.8s infinite;
  will-change: transform;
}
@keyframes copyDrift {
  0%, 100% { transform: translate3d(0,  0,   0); }
  50%      { transform: translate3d(0, -6px, 0); }
}
@keyframes ruleIn { to { transform: scaleX(1); } }
.slide.on .anim:nth-child(2) { animation-delay: .30s; }
.slide.on .anim:nth-child(3) { animation-delay: .44s; }
.slide.on .anim:nth-child(4) { animation-delay: .58s; }
.slide.on .anim:nth-child(5) { animation-delay: .72s; }
@keyframes riseIn { to { opacity: 1; transform: none; } }

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: clamp(10px, 1.15vw, 11.5px);
  font-weight: 600;
  letter-spacing: .3em;
  text-indent: .3em;
  text-transform: uppercase;
  color: var(--cyan);
  text-shadow:
    0 0 1px  rgba(0,0,0, calc(1 * var(--halo, 1))),
    0 0 4px  rgba(0,0,0, calc(.98 * var(--halo, 1))),
    0 0 9px  rgba(0,0,0, calc(.92 * var(--halo, 1))),
    0 0 20px rgba(0,0,0, calc(.80 * var(--halo, 1))),
    0 0 40px rgba(0,0,0, calc(.62 * var(--halo, 1))),
    0 0 76px rgba(0,0,0, calc(.45 * var(--halo, 1)));
}
.kicker::before {
  content: "";
  width: 22px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan));
  text-indent: 0;
}

.badge {
  display: inline-block;
  padding: 3px 8px 2px;
  border: 1px solid rgba(255,196,107,.42);
  border-radius: 3px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .2em;
  text-indent: .2em;
  text-transform: uppercase;
  color: #ffc46b;
  background: rgba(8,6,3,.55);
  box-shadow: 0 0 22px -6px rgba(255,196,107,.45), 0 2px 12px rgba(0,0,0,.6);
}

.card-badge {
  position: absolute;
  top: 11px; right: 12px;
  padding: 3px 7px 2px;
  border: 1px solid rgba(255,196,107,.42);
  border-radius: 3px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #ffc46b;
  background: rgba(10,8,4,.6);
}

.title {
  margin: 0;
  font-size: clamp(44px, 8.6vw, 118px);
  line-height: .96;
  font-weight: 200;
  letter-spacing: -.028em;
  text-wrap: balance;
  text-shadow:
    0 0 2px   rgba(0,0,0, calc(.92 * var(--halo, 1))),
    0 0 6px   rgba(0,0,0, calc(.86 * var(--halo, 1))),
    0 0 14px  rgba(0,0,0, calc(.78 * var(--halo, 1))),
    0 0 30px  rgba(0,0,0, calc(.68 * var(--halo, 1))),
    0 0 62px  rgba(0,0,0, calc(.54 * var(--halo, 1))),
    0 0 120px rgba(0,0,0, calc(.40 * var(--halo, 1))),
    0 2px 6px rgba(0,0,0, calc(.62 * var(--halo, 1)));
}
.title em {
  font-style: normal;
  background: linear-gradient(96deg, var(--cyan), var(--violet) 30%, var(--magenta) 52%, var(--violet) 74%, var(--cyan));
  background-size: 260% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
/* The copy itself never travels - moving large light type either steps in
   whole pixels or goes soft. The gradient underneath it can move all it
   likes: nothing reflows, nothing repaints outside the glyphs, and the
   headline stops reading as a screenshot. This is the one idle animation
   that survives on a phone. */
.slide.on .title em { animation: sheen 9s ease-in-out 1.2s infinite; }
@keyframes sheen {
  0%, 100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}

/* A phone gets no hover and no cursor, so the only thing that says "this is
   live" is motion. The blurb breathes very slightly - far below the
   threshold where text starts to shimmer, but enough to read as alive. */
@media (hover: none) {
  .slide.on .blurb { animation: breathe 7.5s ease-in-out 1.4s infinite; }
  .slide.on .chip  { animation: breathe 6.2s ease-in-out 1.6s infinite; }
  .slide.on .chip:nth-child(2) { animation-delay: 2s; }
  .slide.on .chip:nth-child(3) { animation-delay: 3.4s; }
}
@keyframes breathe {
  0%, 100% { opacity: 1; }
  50%      { opacity: .82; }
}

.blurb {
  margin: 0;
  max-width: 58ch;
  font-size: clamp(14.5px, 1.55vw, 18.5px);
  line-height: 1.62;
  font-weight: 300;
  color: var(--ink-soft);
  text-wrap: pretty;
  text-shadow:
    0 0 2px   rgba(0,0,0, calc(.96 * var(--halo, 1))),
    0 0 5px   rgba(0,0,0, calc(.90 * var(--halo, 1))),
    0 0 12px  rgba(0,0,0, calc(.82 * var(--halo, 1))),
    0 0 26px  rgba(0,0,0, calc(.66 * var(--halo, 1))),
    0 0 54px  rgba(0,0,0, calc(.48 * var(--halo, 1))),
    0 1px 3px rgba(0,0,0, calc(.80 * var(--halo, 1)));
}

/* ---------------------------------------------------------------- actions */

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: clamp(6px, 1.4vh, 14px);
}
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 48px;
  padding: 0 26px;
  border: 1px solid var(--line);
  border-radius: 3px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .17em;
  text-indent: .17em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(3,7,13,.5);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  text-shadow: 0 0 10px rgba(0,0,0,.7);
  overflow: hidden;
  transition: border-color .3s var(--ease), background .3s var(--ease),
              transform .3s var(--ease), box-shadow .3s var(--ease);
}
.btn:hover { border-color: rgba(255,255,255,.4); background: rgba(16,26,40,.62); transform: translateY(-1px); }

.btn.primary {
  /* one accent, nothing else: dark glass, a cyan edge, white type */
  border-color: rgba(77,214,255,.62);
  color: #ffffff;
  background: rgba(3,9,15,.62);
  box-shadow:
    0 0 18px -6px rgba(77,214,255,.45),
    inset 0 0 20px rgba(77,214,255,.07);
}
.btn.primary::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(77,214,255,.1);
  opacity: 0;
  transition: opacity .35s var(--ease);
}
.btn.primary:hover {
  border-color: var(--cyan);
  transform: translateY(-2px);
  box-shadow:
    0 0 28px -6px rgba(77,214,255,.75),
    inset 0 0 26px rgba(77,214,255,.12);
}
.btn.primary:hover::after { opacity: 1; }

/* ------------------------------------------------------------ seg / clusters */

.slide.kind-segmentation .slide-inner {
  max-width: 1180px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.02fr);
  align-items: center;
  gap: clamp(28px, 4.5vw, 66px);
  text-align: left;
  justify-items: stretch;
}
.seg-copy { display: grid; gap: clamp(12px, 1.8vh, 20px); justify-items: start; }
.seg-copy .kicker { opacity: 0; }
.seg-copy .title { font-size: clamp(34px, 4.6vw, 62px); }
.seg-copy .blurb { max-width: 44ch; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 7px 13px;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .07em;
  color: rgba(255,255,255,.62);
  background: rgba(6,8,13,.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  text-shadow: 0 1px 3px rgba(0,0,0,.7);
}
.chip::before {
  content: "";
  display: inline-block;
  width: 5px; height: 5px;
  margin-right: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 9px var(--cyan);
  vertical-align: middle;
}

/* the cluster viewer */
.seg-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 735 / 654;
  max-height: calc(var(--copy-h) - 8px);
  margin: 0 auto;
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  overflow: hidden;
  background: #05070d;
  box-shadow: 0 40px 90px -40px rgba(0,0,0,.95);
}
/* soften the model's studio backdrop into the dark page */
.seg-stage::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background:
    radial-gradient(78% 66% at 50% 44%, transparent 44%, rgba(3,5,10,.62) 82%, rgba(3,5,10,.94) 100%);
}
.seg-plate, .seg-grid { filter: saturate(1.05) contrast(1.06); }
.seg-plate {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: 50% 50%;
  opacity: 0;
  transition: opacity .8s var(--ease);
}
.seg-stage.solid .seg-plate { opacity: 1; }

.seg-grid {
  position: absolute;
  inset: 0;
  display: grid;
  gap: 0px;
  transition: gap 1.4s var(--ease-out);
}
.seg-stage.building .seg-grid { gap: 3px; }
.seg-cell {
  background-repeat: no-repeat;
  opacity: 0;
  transform: scale(.7);
  filter: brightness(1.9) saturate(1.4);
  will-change: opacity, transform;
  backface-visibility: hidden;
}
.seg-stage.play .seg-cell {
  animation: cellIn 1s var(--ease-out) forwards;
}
@keyframes cellIn {
  0%   { opacity: 0; transform: scale(.55); filter: brightness(2.6) saturate(1.6); }
  45%  { opacity: 1; transform: scale(1.03); filter: brightness(1.7) saturate(1.4); }
  100% { opacity: 1; transform: scale(1);    filter: none; }
}
/* phone variant: same choreography, no filter work */
@keyframes cellInLite {
  0%   { opacity: 0; transform: scale(.55); }
  45%  { opacity: 1; transform: scale(1.03); }
  100% { opacity: 1; transform: scale(1); }
}

.seg-scan {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(180deg,
    transparent 0%,
    rgba(77,214,255,.06) 42%,
    rgba(160,220,255,.5) 50%,
    rgba(77,214,255,.06) 58%,
    transparent 100%);
  mix-blend-mode: screen;
}
.seg-stage.play .seg-scan { animation: scan 3.2s var(--ease) 2 forwards; }
@keyframes scan {
  0%   { opacity: 0; transform: translateY(-100%); }
  12%  { opacity: 1; }
  88%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(100%); }
}

.seg-frame {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(77,214,255,.18), inset 0 0 60px rgba(0,0,0,.6);
}
.seg-corner {
  position: absolute;
  width: 16px; height: 16px;
  border: 1px solid rgba(77,214,255,.55);
}
.seg-corner.tl { top: 9px;  left: 9px;  border-right: 0; border-bottom: 0; }
.seg-corner.tr { top: 9px;  right: 9px; border-left: 0;  border-bottom: 0; }
.seg-corner.bl { bottom: 9px; left: 9px; border-right: 0; border-top: 0; }
.seg-corner.br { bottom: 9px; right: 9px; border-left: 0; border-top: 0; }

.seg-hud {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,.62);
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.85));
}
.seg-hud .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .25; } }
.seg-hud .grow { flex: 1; }
.seg-hud .pct { color: var(--cyan); font-variant-numeric: tabular-nums; }
.seg-bar {
  position: absolute;
  left: 0; bottom: 0;
  height: 1px;
  width: 0%;
  background: linear-gradient(90deg, var(--cyan), var(--magenta));
  box-shadow: 0 0 12px rgba(77,214,255,.8);
  transition: width .25s linear;
}

/* ------------------------------------------------------------------ reveal */

.slide.kind-reveal .slide-inner { max-width: 760px; }
.slide.kind-reveal .bridge {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* ---------------------------------------------------------------- features */

.slide.kind-features .title { font-size: clamp(36px, 5.4vw, 74px); }
.slide.kind-features .slide-inner { max-width: 960px; }

.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  width: 100%;
  max-width: 940px;
  margin-top: clamp(8px, 1.6vh, 18px);
  border: 1px solid var(--line-soft);
  background: var(--line-soft);
  border-radius: 5px;
  overflow: hidden;
}
.feature {
  padding: clamp(13px, 1.7vw, 19px);
  text-align: left;
  background: rgba(6,8,14,.62);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: background .3s var(--ease);
}
.feature:hover { background: rgba(18,24,38,.8); }
.feature b {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -.005em;
  color: #fff;
}
.feature span {
  display: block;
  font-size: 12.5px;
  line-height: 1.5;
  font-weight: 300;
  color: var(--ink-faint);
}

/* The call to action does not live inside the slide copy: it is pinned to
   the stage, so it holds exactly the same spot for every slide of a project
   and never blinks out on a slide that declares no action of its own. */
.cta {
  position: absolute;
  z-index: 15;
  left: 0;
  right: 0;
  top: calc(50% + var(--copy-shift) + (var(--copy-h) / 2) + var(--cta-gap));
  display: flex;
  justify-content: center;
  opacity: 0;
  transition: opacity .5s var(--ease);
}
body.lit .cta { opacity: 1; }

.cta-inner { position: relative; display: inline-flex; }

/* the secondary sits beside the primary without shifting it off centre */
.cta .btn.ghost {
  position: absolute;
  left: calc(100% + 12px);
  top: 0;
  white-space: nowrap;
}

/* -------------------------------------------------------------- navigation */

.nav {
  position: absolute;
  z-index: 20;
  left: 0; right: 0;
  bottom: max(26px, env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 0 var(--stage-pad-x);
  opacity: 0;
  transition: opacity .8s var(--ease) .3s;
}
body.lit .nav { opacity: 1; }

.arrow {
  width: 34px; height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: rgba(255,255,255,.45);
  transition: color .25s var(--ease), background .25s var(--ease);
}
.arrow:hover { color: #fff; background: rgba(255,255,255,.08); }
.arrow svg { width: 13px; height: 13px; }

.dots { display: flex; align-items: center; }
.dot-group { display: flex; align-items: center; gap: 9px; }
.dot-group + .dot-group { margin-left: 20px; position: relative; }
.dot-group + .dot-group::before {
  content: "";
  position: absolute;
  left: -11px;
  top: 50%;
  width: 1px;
  height: 9px;
  transform: translateY(-50%);
  background: rgba(255,255,255,.16);
}
.dot-btn {
  position: relative;
  width: 26px;
  height: 24px;
  display: grid;
  place-items: center;
  transition: width .42s var(--ease-out);
}
/* The slide you are on is not a slightly brighter version of the others:
   it is twice as wide, thicker, and it is the only one that glows. You can
   find it from across the room, which is the whole point of an indicator. */
.dot-btn.on { width: 52px; }
.dot-btn i {
  display: block;
  width: 100%;
  height: 2px;
  border-radius: 2px;
  background: rgba(255,255,255,.22);
  overflow: hidden;
  transition: background .3s var(--ease), height .32s var(--ease-out), box-shadow .32s var(--ease);
}
.dot-btn:hover i { background: rgba(255,255,255,.45); }
.dot-btn.on i {
  height: 4px;
  background: rgba(255,255,255,.26);
  box-shadow: 0 0 0 1px rgba(120,190,255,.22), 0 0 16px rgba(77,214,255,.35);
}
.dot-btn i::after {
  content: "";
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--cyan), var(--magenta));
  box-shadow: 0 0 10px rgba(120,190,255,.7);
}
.dot-btn.on i::after { width: var(--p, 0%); }
.dot-btn.seen i::after { width: 100%; background: rgba(255,255,255,.5); box-shadow: none; }

/* Under the active bar, a soft line of the same light draws itself out from
   the centre. It belongs to the bar rather than sitting above it, so the
   position reads at a glance without anything hovering over the row. */
.dot-btn::after {
  content: "";
  position: absolute;
  left: 50%;
  top: calc(50% + 6px);
  height: 2px;
  width: 0;
  border-radius: 2px;
  transform: translateX(-50%);
  background: linear-gradient(90deg, transparent, var(--cyan) 28%, var(--cyan) 72%, transparent);
  filter: blur(2px);
  opacity: 0;
  transition: width .5s var(--ease-out), opacity .4s var(--ease);
}
.dot-btn.on::after { width: 112%; opacity: .7; }

.counter {
  position: absolute;
  right: var(--stage-pad-x);
  bottom: 0;
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .2em;
  color: rgba(255,255,255,.3);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 4px rgba(0,0,0,.9), 0 0 14px rgba(0,0,0,.7);
}

/* Scroll cue. Only when there is something below, only once the viewer
   has reached the end of the reel, and never again after they scroll. */
.cue {
  position: absolute;
  z-index: 20;
  right: var(--stage-pad-x);
  bottom: max(86px, calc(env(safe-area-inset-bottom) + 80px));
  display: none;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
  animation: bob 2.6s ease-in-out infinite;
}
body.has-more .cue.show { display: inline-flex; }
.cue { cursor: pointer; transition: color .3s var(--ease); }
.cue:hover { color: rgba(255,255,255,.72); }
@keyframes bob { 50% { transform: translateY(5px); } }

/* ------------------------------------------------------------ build panel */
/* "Am I even looking at the new one?" is a question a phone cannot answer on
   its own: the footer stamp is hidden at this width and a browser will
   happily serve an index.html it cached ten minutes ago. This panel says
   which build is running, asks the server what it is currently shipping,
   and compares the two. Opened with /?build or by tapping the slide counter
   three times. */
.build-panel {
  position: fixed;
  z-index: 200;
  left: 50%;
  bottom: max(18px, env(safe-area-inset-bottom));
  width: min(420px, calc(100vw - 28px));
  transform: translate(-50%, 14px);
  padding: 16px 18px 14px;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 10px;
  background: rgba(6,8,12,.93);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 20px 60px rgba(0,0,0,.75);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .4s var(--ease), transform .4s var(--ease-out), visibility .4s;
}
.build-panel.show {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate(-50%, 0);
}
.build-panel h3 {
  margin: 0 0 12px;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .28em;
  text-indent: .28em;
  text-transform: uppercase;
  color: rgba(255,255,255,.34);
}
.build-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  padding: 5px 0;
  font-size: 11.5px;
  line-height: 1.45;
}
.build-row + .build-row { border-top: 1px solid rgba(255,255,255,.06); }
.build-row .k {
  flex: none;
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(255,255,255,.32);
}
.build-row .v {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: rgba(255,255,255,.86);
  word-break: break-word;
}
.build-verdict {
  margin-top: 12px;
  padding: 9px 11px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  text-align: center;
}
.build-verdict.wait  { background: rgba(255,255,255,.06); color: rgba(255,255,255,.5); }
.build-verdict.fresh { background: rgba(77,214,255,.12); color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(77,214,255,.28); }
.build-verdict.stale { background: rgba(255,196,107,.13); color: #ffc46b; box-shadow: inset 0 0 0 1px rgba(255,196,107,.34); }
.build-verdict.err   { background: rgba(255,92,225,.10); color: #ff9ae8; box-shadow: inset 0 0 0 1px rgba(255,92,225,.28); }
.build-acts { display: flex; gap: 8px; margin-top: 11px; }
.build-acts button {
  flex: 1;
  min-height: 38px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 6px;
  background: rgba(255,255,255,.04);
  color: rgba(255,255,255,.8);
  font: inherit;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  transition: background .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease);
}
.build-acts button.key { border-color: rgba(77,214,255,.45); color: var(--cyan); }
.build-acts button:hover { background: rgba(255,255,255,.09); color: #fff; }

/* ----------------------------------------------------------------- archive */

.archive {
  position: relative;
  z-index: 4;
  padding: clamp(64px, 10vh, 120px) var(--stage-pad-x) clamp(48px, 8vh, 90px);
  background: #000;
  border-top: 1px solid var(--line-soft);
}
.archive-head {
  max-width: 1160px;
  margin: 0 auto clamp(22px, 3vh, 34px);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
}
.archive-head h2 {
  margin: 0;
  font-size: clamp(20px, 2.6vw, 28px);
  font-weight: 200;
  letter-spacing: -.02em;
}
.archive-head span {
  font-size: 10.5px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.rail {
  max-width: 1160px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  justify-content: start;
  gap: 14px;
}
.rail .card { max-width: 380px; }
.card {
  position: relative;
  display: block;
  aspect-ratio: 16 / 10;
  border: 1px solid var(--line-soft);
  border-radius: 5px;
  overflow: hidden;
  background: #07090f;
  transition: transform .35s var(--ease), border-color .35s var(--ease);
}
.card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,.28); }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .62; transition: opacity .35s var(--ease), transform .6s var(--ease); }
.card:hover img { opacity: .85; transform: scale(1.04); }
.card-body {
  position: absolute;
  inset: auto 0 0 0;
  padding: 14px 15px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.92));
}
.card-body b { display: block; font-size: 14px; font-weight: 500; }
.card-body span { display: block; margin-top: 3px; font-size: 11px; color: var(--ink-faint); }
.card-kicker {
  position: absolute;
  top: 12px; left: 13px;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--cyan);
}

.foot {
  position: relative;
  z-index: 4;
  padding: 26px var(--stage-pad-x) max(26px, env(safe-area-inset-bottom));
  background: #000;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px 20px;
  font-size: 10.5px;
  letter-spacing: .13em;
  color: rgba(255,255,255,.26);
}
.build-stamp {
  margin-left: 10px;
  opacity: .55;
  font-variant-numeric: tabular-nums;
}

.stage .foot-line {
  position: absolute;
  z-index: 20;
  left: var(--stage-pad-x);
  bottom: max(24px, env(safe-area-inset-bottom));
  font-size: 10px;
  letter-spacing: .18em;
  color: rgba(255,255,255,.26);
  opacity: 0;
  transition: opacity .8s var(--ease) .4s;
}
body.lit .build-stamp {
  margin-left: 10px;
  opacity: .55;
  font-variant-numeric: tabular-nums;
}

.stage .foot-line { opacity: 1; }

/* ------------------------------------------------------------- responsive */

@media (max-width: 1080px) {
  .feature-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 900px) {
  .slide.kind-segmentation .slide-inner {
    grid-template-columns: minmax(0, 1fr);
    text-align: center;
    justify-items: center;
    gap: clamp(20px, 3vh, 30px);
  }
  .seg-copy { justify-items: center; }
  .seg-copy .blurb { max-width: 52ch; }
  .chips { justify-content: center; }
  .seg-stage { max-width: 400px; max-height: calc(var(--copy-h) - 236px); }
  .slide.kind-segmentation .chips { display: none; }

     knowing how far into a project it was. It stays, smaller, above the row. */
  .counter {
    right: 50%;
    transform: translateX(50%);
    bottom: calc(100% + 9px);
    font-size: 9.5px;
    letter-spacing: .26em;
    text-indent: .26em;
    color: rgba(255,255,255,.42);
  }

  .dot-btn.on { width: 44px; }
}

@media (max-width: 620px) {
  /* The button hangs below the copy but is not part of it, so a block that
     is centred on its own sits visibly low. The padding is deliberately
     bottom-heavy: it lifts the copy by half the difference, and --copy-shift
     carries the button up with it. */
  :root { --stage-pad-t: 58px; --stage-pad-b: 132px; --copy-h: 56vh; --cta-gap: 24px; }
  .cta { left: var(--stage-pad-x); right: var(--stage-pad-x); }

  .cta .btn.primary { width: 100%; }
  .cta .btn.ghost {
    left: 50%;
    top: auto;
    bottom: calc(100% + 10px);
    transform: translateX(-50%);
  }
  .title { font-size: clamp(38px, 12.5vw, 62px); }
  .blurb { font-size: 14.5px; line-height: 1.6; }
  .btn { min-height: 46px; padding: 0 20px; font-size: 11px; }
  .actions { width: 100%; flex-direction: column; }
  .actions .btn { width: 100%; }
  :root { --copy-h: 54vh; --cta-gap: 18px; }
  .slide.kind-segmentation .seg-copy .title { font-size: clamp(26px, 7.6vw, 36px); }

  .seg-stage { max-height: calc(var(--copy-h) - 186px); }

  .feature b { margin: 0; font-size: 12px; }

@keyframes softOut { from { opacity: 1; } to { opacity: 0; } }

   the page down, it plays the whole thing at ten times speed: the clusters
   snapped together in 276ms instead of 2.6s. Android turns this preference

   setting, so plenty of real visitors land here. Durations stay human,
   movement is what goes. */
/* Android turns this preference on with battery saver, so a large share of
   real phone visitors land in here. The previous version answered that by
   deleting the page's motion outright - the copy stopped moving and the

  .bg-shot.on { animation-duration: 32s; }
  .bg-shot.on img { animation-duration: 41s; }

  .slide .anim { transform: translateY(7px); }
  .slide.on .anim { animation: riseIn .8s var(--ease-out) forwards; }
  .slide.leaving .anim { animation: softOut .45s var(--ease) forwards; }

  }

    50%  { transform: translate3d(5px, 0, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }

  .slide.on .slide-inner { animation-duration: 26s; }
  @keyframes copyDriftCalm { 0%,100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(0,-4px,0); } }
  .slide.leaving .kicker.anim,
  .slide.leaving .seg-copy .kicker { animation: softOut .45s var(--ease) forwards; }
  .seg-copy .kicker { opacity: 0; }

  /* the assembly keeps playing - only the overshoot and the strobe go */
  .seg-stage.play .seg-cell { animation-name: cellInLite; }
  .seg-stage.play .seg-scan { animation-iteration-count: 1; opacity: .6; }

}
